<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROMEO LIVE TV</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* --- الأساسيات الأصلية (بدون تغيير نهائياً) --- */
        :root {
            --main-bg: #040714;
            --accent: #e5b80b;
            --accent-glow: rgba(229, 184, 11, 0.5);
            --card-bg: #1a1d29;
            --glass: rgba(15, 20, 35, 0.8);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--main-bg); color: #fff; overflow-x: hidden; font-size: 13px; transition: background 0.5s; }

        header {
            padding: 8px 5%; background: rgba(4, 7, 20, 0.95); backdrop-filter: blur(10px);
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid rgba(229, 184, 11, 0.2);
        }
        .logo-text { font-weight: 900; font-size: 1rem; color: #fff; }
        .logo-text span { color: var(--accent); }
        
        .download-app-btn {
            background: linear-gradient(45deg, var(--accent), #ffea00);
            color: #000; padding: 5px 12px; border-radius: 15px;
            font-size: 10px; font-weight: 800; text-decoration: none;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .search-area { padding: 10px 5% 5px; }
        .search-input { 
            width: 100%; background: #1a1d29; border: 1px solid rgba(255,255,255,0.1); 
            padding: 8px 15px; border-radius: 8px; color: #fff; outline: none; font-size: 12px;
        }

        .glowing-btn-container { padding: 15px 5% 5px; text-align: center; }
        .glowing-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            background: linear-gradient(90deg, #ffea00, var(--accent), #ffea00);
            background-size: 200% auto;
            color: #000; padding: 10px 20px; border-radius: 25px;
            font-size: 12px; font-weight: 800; text-decoration: none;
            box-shadow: 0 0 15px var(--accent-glow);
            transition: var(--transition);
            animation: glow-pulse 2s infinite, gradient-move 3s linear infinite;
        }
        @keyframes glow-pulse { 0%, 100% { box-shadow: 0 0 10px var(--accent-glow); } 50% { box-shadow: 0 0 20px var(--accent-glow); } }
        @keyframes gradient-move { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }

        .hero-menu { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 10px 5%; }
        .main-btn { 
            height: 60px; border-radius: 10px; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; cursor: pointer; 
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05);
            font-size: 10px; font-weight: 700; transition: var(--transition);
        }
        .main-btn i { font-size: 18px; margin-bottom: 2px; }

        .sub-menu { display: none; grid-template-columns: repeat(2, 1fr); gap: 6px; padding: 5px 5%; animation: slideDown 0.3s ease; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        .sub-item { background: #1a1d29; padding: 8px; border-radius: 6px; text-align: center; font-size: 10px; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); color: #ccc; }

        .section-title { padding: 15px 5% 5px; font-size: 14px; font-weight: 800; color: var(--accent); }
        .cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px 5% 100px; }
        @media (min-width: 768px) { .cards-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); } }

        .card { 
            background: var(--card-bg); border-radius: 8px; overflow: hidden; 
            position: relative; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.6s; border: 1px solid rgba(255,255,255,0.03);
            cursor: pointer;
        }
        .card img { width: 100%; height: 140px; object-fit: cover; }
        .card-info { padding: 5px 4px; background: rgba(0,0,0,0.85); text-align: center; font-size: 9px; font-weight: 700; }

        /* --- واجهة الحلقات (التصميم الأصلي) --- */
        #episodesView {
            position: fixed; inset: 0; background: var(--main-bg); z-index: 1500; display: none;
            flex-direction: column; padding: 20px; overflow-y: auto;
        }
        .ep-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 20px; }
        .ep-item { 
            background: #1a1d29; border: 1px solid var(--accent); padding: 15px; 
            border-radius: 10px; text-align: center; font-weight: 800; cursor: pointer;
        }

        /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
        /* ✨ التعديلات الاحترافية لصفحة المشغل (Player View) ✨ */
        /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */

        .player-view { 
            position: fixed; inset: 0; background: #000; z-index: 2000; display: none;
            flex-direction: column; align-items: center; overflow-y: auto; overflow-x: hidden;
            padding-bottom: 50px;
        }

        /* 1. الخلفية الضبابية */
        .player-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            filter: blur(40px) brightness(0.3);
            transform: scale(1.1);
            z-index: -1;
            transition: opacity 1s ease;
        }

        /* 2. العنوان الاحترافي */
        .player-header {
            width: 100%; padding: 60px 20px 20px; text-align: center;
            animation: fadeInDown 0.8s ease;
        }
        .player-header h1 {
            font-size: 1.4rem; font-weight: 900;
            background: linear-gradient(to bottom, #fff, var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px var(--accent-glow);
        }

        /* 3. حاوية الفيديو المتطورة */
        .video-wrapper { 
            width: 95%; max-width: 900px; border-radius: 20px; 
            overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.9), 0 0 20px var(--accent-glow);
            position: relative; transform: scale(0.9); opacity: 0;
            animation: playerEntry 0.6s cubic-bezier(0.17, 0.67, 0.83, 0.67) forwards;
            background: #000; margin-bottom: 25px;
        }
        @keyframes playerEntry { to { transform: scale(1); opacity: 1; } }

        /* 4. أزرار السيرفرات */
        .server-container {
            display: flex; justify-content: center; gap: 10px;
            width: 95%; max-width: 900px; margin-bottom: 30px; flex-wrap: wrap;
        }
        .server-btn {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: #fff; padding: 10px 18px; border-radius: 12px;
            cursor: pointer; font-weight: 700; transition: var(--transition);
            display: flex; align-items: center; gap: 8px; font-size: 11px;
        }
        .server-btn i { font-size: 14px; }
        .server-btn:active { transform: scale(0.9); }
        .server-btn.active {
            background: var(--accent); color: #000; border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        /* 5. قائمة الحلقات داخل المشغل */
        .episodes-list-container {
            width: 95%; max-width: 900px; text-align: right;
            border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;
        }
        .episodes-list-container h3 { margin-bottom: 15px; color: var(--accent); }
        .episodes-vertical-list {
            display: flex; flex-direction: column; gap: 8px;
        }
        .ep-row {
            background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px;
            display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; transition: var(--transition); border-right: 4px solid transparent;
        }
        .ep-row:hover { background: rgba(255,255,255,0.08); }
        .ep-row.active {
            background: rgba(229, 184, 11, 0.1); border-right-color: var(--accent);
        }
        .ep-row .play-icon { color: var(--accent); opacity: 0; transition: 0.3s; }
        .ep-row.active .play-icon, .ep-row:hover .play-icon { opacity: 1; }

        /* 6. اللودر (Loader) */
        .player-loader {
            position: absolute; inset: 0; background: #000;
            display: flex; align-items: center; justify-content: center;
            z-index: 10; display: none;
        }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .back-nav-btn {
            position: absolute; top: 15px; right: 20px; background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px); color: #fff; border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 15px; border-radius: 50px; cursor: pointer; font-weight: 800; z-index: 2500;
        }

        .bottom-nav { 
            position: fixed; bottom: 12px; left: 5%; right: 5%; height: 58px;
            background: var(--glass); backdrop-filter: blur(15px);
            display: flex; justify-content: space-around; align-items: center;
            border-radius: 18px; border: 1px solid rgba(229, 184, 11, 0.4); z-index: 1000;
        }
        .nav-item { text-align: center; color: rgba(255,255,255,0.5); cursor: pointer; flex: 1; }
        .nav-item i { font-size: 20px; display: block; }
        .nav-item.active { color: var(--accent); }
    </style>
</head>
<body>

<header>
    <div class="logo-text">ROMEO <span>LIVE TV</span></div>
    <a href="https://www.appcreator24.com/app3955137-obzs8n" class="download-app-btn">تنزيل التطبيق</a>
</header>

<div class="search-area">
    <input type="text" id="searchInput" class="search-input" placeholder="بحث في الأفلام، المسلسلات، الأغاني..." oninput="handleSearch()">
</div>

<div class="glowing-btn-container">
    <a href="https://romeo311020.github.io/ROMEO-LIVE-TV-/" class="glowing-btn">
        <i>⚽📺</i>
        <span>شاهد المباريات والقنوات بث مباشر</span>
    </a>
</div>

<div class="hero-menu">
    <div class="main-btn" onclick="toggleSub('m-sub')"><i>🎥</i><span>الأفلام</span></div>
    <div class="main-btn" onclick="toggleSub('s-sub')"><i>📺</i><span>المسلسلات</span></div>
    <div class="main-btn" onclick="filterData('match', 'ملخصات المباريات'); hideAllSubs()"><i>⚽</i><span>المباريات</span></div>
    <div class="main-btn" onclick="filterData('music', 'أجمل الأغاني'); hideAllSubs()"><i>🎵</i><span>الأغاني</span></div>
</div>

<div id="m-sub" class="sub-menu">
    <div class="sub-item" onclick="filterData('egy1', 'أفلام مصرية 1')">أفلام مصرية 1</div>
    <div class="sub-item" onclick="filterData('egy2', 'أفلام مصرية 2')">أفلام مصرية 2</div>
    <div class="sub-item" style="grid-column: span 2;" onclick="filterData('christian', 'أفلام دينية مسيحية')">أفلام دينية مسيحية ✝️</div>
</div>

<div id="s-sub" class="sub-menu">
    <div class="sub-item" onclick="filterData('ramadan', 'رمضان 2026')">رمضان 2026</div>
    <div class="sub-item" onclick="filterData('arabic', 'مسلسلات مصرية')">مسلسلات مصرية</div>
</div>

<div class="section-title" id="gridTitle">المعروض الآن</div>
<div class="cards-grid" id="mainGrid"></div>

<!-- واجهة الحلقات الأصلية (موجودة كاحتياط ولكن سيتم استخدام المشغل الجديد) -->
<div id="episodesView">
    <div class="back-nav-btn" onclick="document.getElementById('episodesView').style.display='none'">✕ رجوع</div>
    <h2 id="seriesHeader" style="margin-top: 60px; text-align: center; color: var(--accent);"></h2>
    <div class="ep-grid" id="episodesGrid"></div>
</div>

<!-- 🎬 المشغل الاحترافي المحدث 🎬 -->
<div id="playerView" class="player-view">
    <div class="player-bg" id="playerBg"></div>
    <div class="back-nav-btn" onclick="closePlayer()">✕ رجوع</div>
    
    <div class="player-header">
        <h1 id="playerMainTitle">حصرياً على ROMEO LIVE TV</h1>
    </div>

    <div class="video-wrapper" id="videoContainerMain">
        <div class="player-loader" id="playerLoader"><div class="spinner"></div></div>
        <iframe id="mainIframe" src="" allowfullscreen sandbox="allow-forms allow-pointer-lock allow-same-origin allow-scripts allow-top-navigation"></iframe>
    </div>

    <!-- أزرار السيرفرات -->
    <div class="server-container" id="serverList">
        <!-- سيتم توليدها برمجياً -->
    </div>

    <!-- قائمة الحلقات أسفل المشغل -->
    <div class="episodes-list-container" id="playerEpisodesContainer" style="display: none;">
        <h3>قائمة الحلقات</h3>
        <div class="episodes-vertical-list" id="playerVerticalEpisodes">
            <!-- سيتم توليد الحلقات برمجياً -->
        </div>
    </div>
</div>

<div class="bottom-nav">
    <div class="nav-item active" onclick="location.reload()"><i>🏠</i><span>الرئيسية</span></div>
    <div class="nav-item" onclick="showFavorites()"><i>❤️</i><span>المفضلة</span></div>
    <div class="nav-item" onclick="window.location.href='https://romeo311020.github.io/ROMEO-MATCH/'"><i>⚽</i><span>المباريات</span></div>
    <div class="nav-item" onclick="window.open('https://wa.me/201286716976')"><i>💬</i><span>اطلب</span></div>
</div>

<script>
    let database = [];
    let currentItem = null;

    async function loadData() {
        try {
            const response = await fetch('data.json');
            const data = await response.json();
            database = data.items || []; 
            render(database);
        } catch (e) { document.getElementById('gridTitle').innerText = "خطأ في الاتصال"; }
    }

    function render(data) {
        const grid = document.getElementById('mainGrid');
        grid.innerHTML = '';
        data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<img src="${item.img}"><div class="card-info">${item.name}</div>`;
            card.onclick = () => {
                currentItem = item;
                if(item.type === 'series') {
                   // في المسلسلات نفتح المشغل مع أول حلقة تلقائياً
                   openProfessionalPlayer(item.episodes[0].link, item.name, item.img, true);
                } else {
                   openProfessionalPlayer(item.link, item.name, item.img, false);
                }
            };
            grid.appendChild(card);
        });
    }

    // المنطق الجديد لتشغيل المشغل الاحترافي
    function openProfessionalPlayer(link, title, image, isSeries) {
        const playerView = document.getElementById('playerView');
        const iframe = document.getElementById('mainIframe');
        const bg = document.getElementById('playerBg');
        const titleElement = document.getElementById('playerMainTitle');
        
        playerView.style.display = 'flex';
        bg.style.backgroundImage = `url(${image})`;
        titleElement.innerText = `حصرياً ${title} على ROMEO LIVE TV`;
        
        // تغيير الرابط مع تأثير Fade
        changeServer(link);

        // توليد السيرفرات
        setupServers(link);

        // إذا كان مسلسل، نعرض قائمة الحلقات
        const epContainer = document.getElementById('playerEpisodesContainer');
        if(isSeries && currentItem.episodes) {
            epContainer.style.display = 'block';
            renderVerticalEpisodes();
        } else {
            epContainer.style.display = 'none';
        }
    }

    function setupServers(baseLink) {
        const serverList = document.getElementById('serverList');
        serverList.innerHTML = '';
        
        // تنظيف الرابط الأساسي من أي سيرفر قديم لإضافة السيرفر الجديد
        let cleanLink = baseLink.split('?')[0];

        for(let i=1; i<=4; i++) {
            const btn = document.createElement('button');
            btn.className = `server-btn ${i === 1 ? 'active' : ''}`;
            btn.innerHTML = `<i class="fas fa-server"></i> Server ${i}`;
            btn.onclick = function() {
                // إزالة Active من الكل
                document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                
                // تغيير الرابط
                const newServerLink = `${cleanLink}?server=${i}`;
                changeServer(newServerLink);
            };
            serverList.appendChild(btn);
        }
    }

    function changeServer(link) {
        const iframe = document.getElementById('mainIframe');
        const loader = document.getElementById('playerLoader');
        
        loader.style.display = 'flex';
        iframe.style.opacity = '0';
        iframe.style.transform = 'scale(0.95)';

        setTimeout(() => {
            iframe.src = link;
            iframe.onload = () => {
                loader.style.display = 'none';
                iframe.style.opacity = '1';
                iframe.style.transform = 'scale(1)';
            };
        }, 300);
    }

    function renderVerticalEpisodes() {
        const container = document.getElementById('playerVerticalEpisodes');
        container.innerHTML = '';
        
        currentItem.episodes.forEach((ep, index) => {
            const row = document.createElement('div');
            row.className = `ep-row ${index === 0 ? 'active' : ''}`;
            row.innerHTML = `
                <span>${ep.name || 'الحلقة ' + ep.num}</span>
                <i class="fas fa-play-circle play-icon"></i>
            `;
            row.onclick = function() {
                document.querySelectorAll('.ep-row').forEach(r => r.classList.remove('active'));
                this.classList.add('active');
                changeServer(ep.link);
                // إعادة ضبط السيرفرات لهذه الحلقة
                setupServers(ep.link);
                // سكرول للأعلى للمشغل
                document.getElementById('playerView').scrollTo({ top: 0, behavior: 'smooth' });
            };
            container.appendChild(row);
        });
    }

    function closePlayer() {
        document.getElementById('playerView').style.display = 'none';
        document.getElementById('mainIframe').src = '';
    }

    function toggleSub(id) {
        const menu = document.getElementById(id);
        const isVisible = menu.style.display === 'grid';
        hideAllSubs();
        menu.style.display = isVisible ? 'none' : 'grid';
    }

    function hideAllSubs() { document.querySelectorAll('.sub-menu').forEach(m => m.style.display = 'none'); }

    function filterData(cat, title) {
        document.getElementById('gridTitle').innerText = title;
        render(database.filter(i => i.cat === cat));
        hideAllSubs();
    }

    function handleSearch() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        render(database.filter(i => i.name.toLowerCase().includes(q)));
    }

    loadData();
</script>
</body>
</html>
