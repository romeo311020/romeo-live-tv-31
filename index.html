<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>ROMEO LIVE TV</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family: Arial, sans-serif;
  background: linear-gradient(130deg,#0a0f26,#1b243b,#0d1124);
  background-size:400% 400%;
  animation: bgShift 15s ease infinite;
  color:#fff;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  text-align:center;
  overflow:hidden;
}
@keyframes bgShift{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
.particle{position:absolute;width:4px;height:4px;background:white;border-radius:50%;opacity:0.6;box-shadow:0 0 6px #00bfff;animation:moveParticle linear infinite;}
@keyframes moveParticle{0%{transform: translate(0,0);}100%{transform: translate(50px, -100vh);}}
.container{width:100%;max-width:380px;background:rgba(0,0,0,0.45);padding:25px 18px;border-radius:15px;box-shadow:0 0 25px rgba(0,0,0,0.6);backdrop-filter:blur(7px);position:relative;z-index:1;}
.logo{width:110px;height:110px;margin:0 auto 15px auto;background:radial-gradient(circle,#ffcc00,#b38f00);border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:32px;font-weight:bold;color:#0a0f26;animation: logoGlow 2s infinite alternate;}
@keyframes logoGlow{0%{box-shadow:0 0 10px #ffcc00;}50%{box-shadow:0 0 20px #ffcc00;}100%{box-shadow:0 0 10px #ffcc00;}}
h1{font-size:30px;margin-bottom:12px;color:#ffcf41;}
.desc{font-size:17px;margin-bottom:20px;color:#e0e0e0;}
.btn{display:flex;align-items:center;justify-content:center;padding:14px;margin-top:12px;font-size:19px;text-decoration:none;width:100%;border-radius:8px;transition:0.3s;color:#fff;cursor:pointer;}
.btn:hover{ transform:scale(1.05); }
.btn-login{ background:linear-gradient(90deg,#4e6ef2,#2c3ce6); }
.btn-music{ background:linear-gradient(90deg,#b45dee,#7b31d4); }
.btn-download{ background:linear-gradient(90deg,#26b5ff,#0c80c9); }
.footer{font-size:13px;margin-top:18px;color:#ccc;}
.whatsapp{position:fixed;bottom:25px;right:25px;width:60px;height:60px;background:#25D366;border-radius:50%;display:flex;justify-content:center;align-items:center;z-index:2;}
.whatsapp img{ width:32px; }

/* إعلان الفيديو */
#adPopup{position:fixed;top:0; left:0;width:100%; height:100%;background:rgba(0,0,0,0.95);display:none;justify-content:center;align-items:center;z-index:999;}
.ad-box{position:relative;width:90%;max-width:450px;border-radius:15px;overflow:hidden;box-shadow:0 15px 50px rgba(0,0,0,0.8);border:2px solid #ffcf41;}
.ad-box video{width:100%; display:block; border-radius:15px; box-shadow:0 5px 25px rgba(255,255,255,0.2);}
#skipTimer{
  position:absolute;top:10px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,0.7);color:#ffcf41;padding:8px 16px;border-radius:12px;font-weight:bold;font-size:18px;
  text-shadow:0 0 8px #ffcf41;
  animation: glow 1.5s ease-in-out infinite alternate;
}
@keyframes glow{0%{text-shadow:0 0 5px #ffcf41;}100%{text-shadow:0 0 15px #ffcf41;}}
#skipBtn{
  position:absolute;top:10px;left:50%;transform:translateX(-50%);
  padding:8px 20px;background:#ffcf41;color:#0a0f26;font-weight:bold;border:none;border-radius:50px;cursor:pointer;font-size:18px;
  display:none;
  box-shadow:0 0 15px #ffcf41;
  transition:0.3s;
}
#skipBtn:hover{
  transform:scale(1.1);
  box-shadow:0 0 25px #ffcf41,0 0 35px #ffcf41;
}
</style>
</head>

<body>
<div id="particles"></div>

<div class="container">
  <div class="logo">R</div>
  <h1>ROMEO LIVE TV</h1>
  <div class="desc" ROMEO LIVE TV</div>

  <div class="btn btn-login" onclick="showAd('https://romeo-live-online.lovable.app/dashboard')">🔥👨🏾‍💻دخول</div>
  <a href="https://romeo311020.github.io/romeo-music-" class="btn btn-music">الأغاني 🔥</a>
  <a href="https://romeo311020.github.io/ROMEO-LIVE-TV.-apk1/" class="btn btn-download">تحميل التطبيق 📱</a>
  <div class="footer">Powered by ROMEO LIVE TV</div>
</div>

<a class="whatsapp" href="https://api.whatsapp.com/send?phone=201286716976" target="_blank">
  <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png">
</a>

<!-- إعلان الفيديو -->
<div id="adPopup">
  <div class="ad-box">
    <video id="adVideo" autoplay muted>
      <source src="https://raw.githubusercontent.com/romeo311020/romeo-live-tv-31/e1e58aa151973e1cdf083810606414fe7bed2e0b/ad.mp4" type="video/mp4">
    </video>
    <div id="skipTimer">5</div>
    <button id="skipBtn" onclick="closeAd()">تخطي الإعلان ✖</button>
  </div>
</div>

<script>
// Particles
const particleContainer=document.getElementById('particles');
for(let i=0;i<50;i++){
  const p=document.createElement('div');
  p.classList.add('particle');
  p.style.top=Math.random()*window.innerHeight+'px';
  p.style.left=Math.random()*window.innerWidth+'px';
  p.style.animationDuration=(8+Math.random()*12)+'s';
  particleContainer.appendChild(p);
}

// إعلان الفيديو مع عد تنازلي
let targetLink="",countdown=5,countdownInterval;
function showAd(link){
  targetLink=link;
  countdown=5;
  document.getElementById("adPopup").style.display="flex";
  document.getElementById("skipTimer").textContent=countdown;
  document.getElementById("skipBtn").style.display="none";

  countdownInterval=setInterval(()=>{
    countdown--;
    if(countdown>0){
      document.getElementById("skipTimer").textContent=countdown;
    } else {
      clearInterval(countdownInterval);
      document.getElementById("skipTimer").style.display="none";
      document.getElementById("skipBtn").style.display="block";
    }
  },1000);
}

function closeAd(){
  document.getElementById("adPopup").style.display="none";
  window.location.href=targetLink;
}

// يغلق الإعلان تلقائياً بعد انتهاء الفيديو
document.getElementById("adVideo").onended=function(){ closeAd(); };
</script>
</body>
</html>
