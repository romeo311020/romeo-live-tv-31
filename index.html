<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROMEO LIVE TV</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        /* --- الأساسيات الأصلية (بدون تغيير) --- */
        :root {
            --main-bg: #040714;
            --accent: #e5b80b;
            --accent-glow: rgba(229, 184, 11, 0.5);
            --card-bg: #1a1d29;
            --glass: rgba(15, 20, 35, 0.8);
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--main-bg); color: #fff; overflow-x: hidden; font-size: 13px; transition: background 0.5s; }

        header {
            padding: 8px 5%; background: rgba(4, 7, 20, 0.95); backdrop-filter: blur(10px);
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid rgba(229, 184, 11, 0.2);
        }
        .logo-text { font-weight: 900; font-size: 1rem; color: #fff; }
        .logo-text span { color: var(--accent); }
        
        .download-app-btn {
            background: linear-gradient(45deg, var(--accent), #ffea00);
            color: #000; padding: 5px 12px; border-radius: 15px;
            font-size: 10px; font-weight: 800; text-decoration: none;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        /* --- تحسينات واجهة البحث والأزرار --- */
        .search-area { padding: 10px 5% 5px; }
        .search-input { 
            width: 100%; background: #1a1d29; border: 1px solid rgba(255,255,255,0.1); 
            padding: 10px 15px; border-radius: 12px; color: #fff; outline: none; font-size: 13px;
            transition: var(--transition);
        }
        .search-input:focus { border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }

        .glowing-btn-container { padding: 15px 5% 5px; text-align: center; }
        .glowing-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            background: linear-gradient(90deg, #ffea00, var(--accent), #ffea00);
            background-size: 200% auto;
            color: #000; padding: 12px 25px; border-radius: 30px;
            font-size: 13px; font-weight: 800; text-decoration: none;
            box-shadow: 0 0 15px var(--accent-glow);
            transition: var(--transition);
            animation: glow-pulse 2s infinite, gradient-move 3s linear infinite;
        }

        @keyframes glow-pulse { 0%, 100% { box-shadow: 0 0 10px var(--accent-glow); } 50% { box-shadow: 0 0 25px var(--accent-glow); } }
        @keyframes gradient-move { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }

        .hero-menu { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 10px 5%; }
        .main-btn { 
            height: 65px; border-radius: 12px; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; cursor: pointer; 
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05);
            font-size: 11px; font-weight: 700; transition: var(--transition);
        }
        .main-btn:active { transform: scale(0.92); }
        .main-btn i { font-size: 20px; margin-bottom: 4px; }

        .sub-menu { display: none; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 5px 5%; animation: slideDown 0.4s ease; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .sub-item { background: #1a1d29; padding: 12px; border-radius: 10px; text-align: center; font-size: 11px; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); color: #ccc; }

        .section-title { padding: 20px 5% 5px; font-size: 16px; font-weight: 800; color: var(--accent); letter-spacing: 1px; }
        .cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 10px 5% 100px; }
        @media (min-width: 768px) { .cards-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); } }

        .card { 
            background: var(--card-bg); border-radius: 12px; overflow: hidden; 
            position: relative; transition: var(--transition); border: 1px solid rgba(255,255,255,0.03);
            cursor: pointer;
        }
        .card:hover { transform: translateY(-5px); border-color: var(--accent); }
        .card img { width: 100%; height: 160px; object-fit: cover; transition: 0.5s; }
        .card:hover img { transform: scale(1.1); }
        .card-info { padding: 8px 5px; background: linear-gradient(to top, #000, transparent); position: absolute; bottom: 0; width: 100%; text-align: center; font-size: 10px; font-weight: 700; }

        /* --- واجهة المشغل السينمائية الجديدة (Player View) --- */
        .player-view { 
            position: fixed; inset: 0; background: #000; z-index: 2000; display: none;
            flex-direction: column; align-items: center; overflow-y: auto; overflow-x: hidden;
            padding-bottom: 50px;
        }

        /* الخلفية الديناميكية */
        .player-bg {
            position: fixed; inset: 0; z-index: -1;
            background-size: cover; background-position: center;
            filter: blur(40px) brightness(0.3);
            transform: scale(1.1);
            animation: kenBurns 20s infinite alternate;
        }
        @keyframes kenBurns { from { transform: scale(1.1); } to { transform: scale(1.3); } }
        .player-overlay { position: fixed; inset: 0; background: radial-gradient(circle, transparent 20%, #040714 100%); z-index: -1; }

        /* هيدر المشغل */
        .player-header {
            width: 100%; padding: 25px 5%; text-align: center;
            animation: fadeInDown 0.8s ease;
        }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        .player-header h1 { 
            font-size: 1.4rem; font-weight: 900; 
            background: linear-gradient(to bottom, #fff, var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        /* حاوية الفيديو Premium */
        .video-wrapper { 
            width: 92%; max-width: 1000px; border-radius: 20px; overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 20px rgba(229, 184, 11, 0.2);
            border: 1px solid rgba(255,255,255,0.1);
            position: relative; background: #000;
            transform: scale(0.95); opacity: 0; animation: playerEntry 0.6s forwards 0.3s;
        }
        @keyframes playerEntry { to { transform: scale(1); opacity: 1; } }
        
        iframe { width: 100%; aspect-ratio: 16/9; border: none; display: block; }

        /* نظام السيرفرات */
        .server-container {
            width: 92%; max-width: 1000px; margin-top: 20px;
            display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
            animation: fadeInUp 0.8s ease;
        }
        .server-btn {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: #fff; padding: 10px 20px; border-radius: 30px;
            font-size: 12px; font-weight: 700; cursor: pointer; transition: var(--transition);
        }
        .server-btn.active { 
            background: var(--accent); color: #000; 
            box-shadow: 0 0 15px var(--accent-glow); border-color: transparent;
        }

        /* نظام الحلقات داخل المشغل */
        .player-episodes {
            width: 92%; max-width: 1000px; margin-top: 30px;
            animation: fadeInUp 1s ease;
        }
        .ep-list-title { color: var(--accent); margin-bottom: 15px; font-size: 15px; font-weight: 800; border-right: 3px solid var(--accent); padding-right: 10px; }
        .ep-flex { display: flex; flex-direction: column; gap: 10px; }
        .ep-card-wide {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05);
            padding: 15px 20px; border-radius: 15px; display: flex; justify-content: space-between;
            align-items: center; cursor: pointer; transition: var(--transition);
        }
        .ep-card-wide:hover { background: rgba(255,255,255,0.08); transform: translateX(-5px); }
        .ep-card-wide.active { border-color: var(--accent); background: rgba(229, 184, 11, 0.1); }
        .ep-card-wide .ep-info { display: flex; align-items: center; gap: 15px; }
        .ep-card-wide .ep-num { background: var(--accent); color: #000; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 12px; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* أزرار التنقل */
        .back-nav-btn {
            position: absolute; top: 20px; left: 20px; background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px); width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-weight: 800; color: #fff; z-index: 2100; border: 1px solid rgba(255,255,255,0.2);
        }

        /* Loading Spinner */
        .loader {
            position: absolute; inset: 0; background: #000; display: none;
            align-items: center; justify-content: center; z-index: 10;
        }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* نفيجيشن سفلي */
        .bottom-nav { 
            position: fixed; bottom: 12px; left: 5%; right: 5%; height: 60px;
            background: var(--glass); backdrop-filter: blur(20px);
            display: flex; justify-content: space-around; align-items: center;
            border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); z-index: 1000;
        }
        .nav-item { text-align: center; color: rgba(255,255,255,0.4); cursor: pointer; flex: 1; transition: 0.3s; }
        .nav-item i { font-size: 22px; display: block; margin-bottom: 2px; }
        .nav-item.active { color: var(--accent); transform: translateY(-5px); }
    </style>
</head>
<body>

<header>
    <div class="logo-text">ROMEO <span>LIVE TV</span></div>
    <a href="https://www.appcreator24.com/app3955137-obzs8n" class="download-app-btn">تنزيل التطبيق</a>
</header>

<div class="search-area">
    <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن فيلم أو مسلسل..." oninput="handleSearch()">
</div>

<div class="glowing-btn-container">
    <a href="https://romeo311020.github.io/ROMEO-LIVE-TV-/" class="glowing-btn">
        <i>⚽📺</i>
        <span>شاهد القنوات والمباريات بث مباشر</span>
    </a>
</div>

<div class="hero-menu">
    <div class="main-btn" onclick="toggleSub('m-sub')"><i>🎥</i><span>الأفلام</span></div>
    <div class="main-btn" onclick="toggleSub('s-sub')"><i>📺</i><span>المسلسلات</span></div>
    <div class="main-btn" onclick="filterData('match', 'ملخصات المباريات'); hideAllSubs()"><i>⚽</i><span>المباريات</span></div>
    <div class="main-btn" onclick="filterData('music', 'أجمل الأغاني'); hideAllSubs()"><i>🎵</i><span>الأغاني</span></div>
</div>

<div id="m-sub" class="sub-menu">
    <div class="sub-item" onclick="filterData('egy1', 'أفلام مصرية 1')">أفلام مصرية 1</div>
    <div class="sub-item" onclick="filterData('egy2', 'أفلام مصرية 2')">أفلام مصرية 2</div>
    <div class="sub-item" style="grid-column: span 2;" onclick="filterData('christian', 'أفلام دينية مسيحية')">أفلام دينية مسيحية ✝️</div>
</div>

<div id="s-sub" class="sub-menu">
    <div class="sub-item" onclick="filterData('ramadan', 'رمضان 2026')">رمضان 2026</div>
    <div class="sub-item" onclick="filterData('arabic', 'مسلسلات مصرية')">مسلسلات مصرية</div>
</div>

<div class="section-title" id="gridTitle">المعروض الآن</div>
<div class="cards-grid" id="mainGrid"></div>

<div id="playerView" class="player-view">
    <div class="player-bg" id="playerBg"></div>
    <div class="player-overlay"></div>
    
    <div class="back-nav-btn" onclick="closePlayer()">✕</div>
    
    <div class="player-header">
        <h1 id="playerMainTitle">جاري التحميل...</h1>
        <p style="color: rgba(255,255,255,0.6); font-size: 11px; margin-top: 5px;">حصرياً على ROMEO LIVE TV</p>
    </div>

    <div class="video-wrapper">
        <div id="videoLoader" class="loader"><div class="spinner"></div></div>
        <div id="videoContainer"></div>
    </div>

    <div class="server-container" id="serverList"></div>

    <div class="player-episodes" id="playerEpisodesBox" style="display: none;">
        <div class="ep-list-title">قائمة الحلقات</div>
        <div class="ep-flex" id="playerEpisodesGrid"></div>
    </div>
</div>

<div class="bottom-nav">
    <div class="nav-item active" onclick="location.reload()"><i>🏠</i><span>الرئيسية</span></div>
    <div class="nav-item" onclick="showFavorites()"><i>❤️</i><span>المفضلة</span></div>
    <div class="nav-item" onclick="window.location.href='https://romeo311020.github.io/ROMEO-MATCH/'"><i>⚽</i><span>المباريات</span></div>
    <div class="nav-item" onclick="window.open('https://wa.me/201286716976')"><i>💬</i><span>اطلب</span></div>
</div>

<script>
    let database = [];
    let currentItem = null;

    async function loadData() {
        try {
            const response = await fetch('data.json');
            const data = await response.json();
            database = data.items || []; 
            render(database);
        } catch (e) { document.getElementById('gridTitle').innerText = "خطأ في الاتصال بالسيرفر"; }
    }

    function render(data) {
        const grid = document.getElementById('mainGrid');
        grid.innerHTML = '';
        data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<img src="${item.img}"><div class="card-info">${item.name}</div>`;
            card.onclick = () => openPremiumPlayer(item);
            grid.appendChild(card);
        });
    }

    // المشغل الاحترافي الجديد
    function openPremiumPlayer(item) {
        currentItem = item;
        const view = document.getElementById('playerView');
        view.style.display = 'flex';
        document.body.style.overflow = 'hidden';

        // ضبط الخلفية والعنوان
        document.getElementById('playerBg').style.backgroundImage = `url(${item.img})`;
        document.getElementById('playerMainTitle').innerText = item.name;

        // توليد السيرفرات
        setupServers(item.servers || [item.link]);

        // التعامل مع المسلسلات
        const epBox = document.getElementById('playerEpisodesBox');
        if(item.type === 'series' && item.episodes) {
            epBox.style.display = 'block';
            renderPlayerEpisodes(item.episodes);
            // تشغيل أول حلقة تلقائياً
            changeVideoSource(item.episodes[0].link, 0);
        } else {
            epBox.style.display = 'none';
            changeVideoSource(item.link || item.servers[0]);
        }
    }

    function setupServers(servers) {
        const container = document.getElementById('serverList');
        container.innerHTML = '';
        servers.forEach((srv, index) => {
            const btn = document.createElement('button');
            btn.className = `server-btn ${index === 0 ? 'active' : ''}`;
            btn.innerText = `سيرفر ${index + 1}`;
            btn.onclick = () => {
                document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                changeVideoSource(srv);
            };
            container.appendChild(btn);
        });
    }

    function renderPlayerEpisodes(episodes) {
        const grid = document.getElementById('playerEpisodesGrid');
        grid.innerHTML = '';
        episodes.forEach((ep, index) => {
            const card = document.createElement('div');
            card.className = `ep-card-wide ${index === 0 ? 'active' : ''}`;
            card.innerHTML = `
                <div class="ep-info">
                    <div class="ep-num">${index + 1}</div>
                    <span>الحلقة ${index + 1}</span>
                </div>
                <i style="color: var(--accent)">▶</i>
            `;
            card.onclick = () => {
                document.querySelectorAll('.ep-card-wide').forEach(c => c.classList.remove('active'));
                card.classList.add('active');
                changeVideoSource(ep.link);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };
            grid.appendChild(card);
        });
    }

    function changeVideoSource(link) {
        const loader = document.getElementById('videoLoader');
        const container = document.getElementById('videoContainer');
        
        loader.style.display = 'flex';
        container.style.opacity = '0.3';

        container.innerHTML = `
            <iframe src="${link}" allowfullscreen scrolling="no" 
            sandbox="allow-forms allow-pointer-lock allow-same-origin allow-scripts allow-top-navigation"></iframe>
        `;

        // محاكاة انتهاء التحميل
        setTimeout(() => {
            loader.style.display = 'none';
            container.style.opacity = '1';
        }, 1500);
    }

    function closePlayer() {
        document.getElementById('playerView').style.display = 'none';
        document.getElementById('videoContainer').innerHTML = '';
        document.body.style.overflow = 'auto';
    }

    // وظائف التحكم الأصلية
    function toggleSub(id) {
        const menu = document.getElementById(id);
        const isVisible = menu.style.display === 'grid';
        hideAllSubs();
        menu.style.display = isVisible ? 'none' : 'grid';
    }

    function hideAllSubs() { document.querySelectorAll('.sub-menu').forEach(m => m.style.display = 'none'); }

    function filterData(cat, title) {
        document.getElementById('gridTitle').innerText = title;
        render(database.filter(i => i.cat === cat));
        hideAllSubs();
    }

    function handleSearch() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        render(database.filter(i => i.name.toLowerCase().includes(q)));
    }

    loadData();
</script>
</body>
</html>
