<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROMEO LIVE TV</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        /* --- الأساسيات الأصلية (بدون تغيير نهائياً) --- */
        :root {
            --main-bg: #040714;
            --accent: #e5b80b;
            --accent-glow: rgba(229, 184, 11, 0.5);
            --card-bg: #1a1d29;
            --glass: rgba(15, 20, 35, 0.8);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--main-bg); color: #fff; overflow-x: hidden; font-size: 13px; transition: background 0.5s; }

        header {
            padding: 8px 5%; background: rgba(4, 7, 20, 0.95); backdrop-filter: blur(10px);
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid rgba(229, 184, 11, 0.2);
        }
        .logo-text { font-weight: 900; font-size: 1rem; color: #fff; }
        .logo-text span { color: var(--accent); }
        
        .download-app-btn {
            background: linear-gradient(45deg, var(--accent), #ffea00);
            color: #000; padding: 5px 12px; border-radius: 15px;
            font-size: 10px; font-weight: 800; text-decoration: none;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .search-area { padding: 10px 5% 5px; }
        .search-input { 
            width: 100%; background: #1a1d29; border: 1px solid rgba(255,255,255,0.1); 
            padding: 8px 15px; border-radius: 8px; color: #fff; outline: none; font-size: 12px;
        }

        .glowing-btn-container { padding: 15px 5% 5px; text-align: center; }
        .glowing-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            background: linear-gradient(90deg, #ffea00, var(--accent), #ffea00);
            background-size: 200% auto;
            color: #000; padding: 10px 20px; border-radius: 25px;
            font-size: 12px; font-weight: 800; text-decoration: none;
            box-shadow: 0 0 15px var(--accent-glow);
            transition: var(--transition);
            animation: glow-pulse 2s infinite, gradient-move 3s linear infinite;
        }
        @keyframes glow-pulse { 0%, 100% { box-shadow: 0 0 10px var(--accent-glow); } 50% { box-shadow: 0 0 20px var(--accent-glow); } }
        @keyframes gradient-move { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }

        .hero-menu { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 10px 5%; }
        .main-btn { 
            height: 60px; border-radius: 10px; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; cursor: pointer; 
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05);
            font-size: 10px; font-weight: 700; transition: var(--transition);
        }
        .main-btn i { font-size: 18px; margin-bottom: 2px; }

        .sub-menu { display: none; grid-template-columns: repeat(2, 1fr); gap: 6px; padding: 5px 5%; animation: slideDown 0.3s ease; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        .sub-item { background: #1a1d29; padding: 8px; border-radius: 6px; text-align: center; font-size: 10px; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); color: #ccc; }

        .section-title { padding: 15px 5% 5px; font-size: 14px; font-weight: 800; color: var(--accent); }
        .cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px 5% 100px; }
        @media (min-width: 768px) { .cards-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); } }

        .card { 
            background: var(--card-bg); border-radius: 8px; overflow: hidden; 
            position: relative; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.6s; border: 1px solid rgba(255,255,255,0.03);
            cursor: pointer;
        }
        .card img { width: 100%; height: 140px; object-fit: cover; }
        .card-info { padding: 5px 4px; background: rgba(0,0,0,0.85); text-align: center; font-size: 9px; font-weight: 700; }

        /* --- واجهة الحلقات --- */
        #episodesView {
            position: fixed; inset: 0; background: var(--main-bg); z-index: 1500; display: none;
            flex-direction: column; padding: 20px; overflow-y: auto;
        }
        .ep-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 20px; }
        .ep-item { 
            background: #1a1d29; border: 1px solid var(--accent); padding: 15px; 
            border-radius: 10px; text-align: center; font-weight: 800; cursor: pointer;
        }

        /* --- المشغل المطور (التعديلات هنا) --- */
        .player-view { 
            position: fixed; inset: 0; background: #000; z-index: 2000; display: none;
            flex-direction: column; align-items: center; justify-content: flex-start;
            padding-top: 80px; overflow-y: auto;
        }
        .video-wrapper { 
            width: 95%; max-width: 1000px; border-radius: 15px; overflow: hidden; 
            box-shadow: 0 0 30px rgba(0,0,0,0.5); position: relative;
            background: #000;
        }
        iframe { width: 100%; aspect-ratio: 16/9; border: none; transition: opacity 0.5s ease; }
        
        /* تأثير الانتقال واللودر */
        .iframe-loading { opacity: 0; }
        .player-loader {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            display: none; color: var(--accent); font-size: 20px; z-index: 5;
        }

        .player-info-area { width: 95%; max-width: 1000px; margin-top: 15px; text-align: right; }
        .player-title-text { font-size: 14px; font-weight: 800; margin-bottom: 15px; color: #fff; }
        .player-title-text span { color: var(--accent); }

        /* أزرار السيرفرات */
        .servers-container {
            display: flex; gap: 10px; overflow-x: auto; padding: 5px 0 15px;
            scrollbar-width: none; -ms-overflow-style: none;
        }
        .servers-container::-webkit-scrollbar { display: none; }

        .server-btn {
            background: #1a1d29; color: #fff; border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 18px; border-radius: 8px; cursor: pointer; font-weight: 700;
            white-space: nowrap; transition: var(--transition); font-size: 12px;
        }
        .server-btn:hover { transform: scale(1.05); border-color: var(--accent); color: var(--accent); }
        .server-btn.active { 
            background: var(--accent); color: #000; border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .back-nav-btn {
            position: absolute; top: 20px; right: 20px; background: var(--accent);
            padding: 8px 20px; border-radius: 30px; cursor: pointer; font-weight: 800; color: #000;
            z-index: 2001;
        }

        .bottom-nav { 
            position: fixed; bottom: 12px; left: 5%; right: 5%; height: 58px;
            background: var(--glass); backdrop-filter: blur(15px);
            display: flex; justify-content: space-around; align-items: center;
            border-radius: 18px; border: 1px solid rgba(229, 184, 11, 0.4); z-index: 1000;
        }
        .nav-item { text-align: center; color: rgba(255,255,255,0.5); cursor: pointer; flex: 1; }
        .nav-item i { font-size: 20px; display: block; }
        .nav-item.active { color: var(--accent); }
    </style>
</head>
<body>

<header>
    <div class="logo-text">ROMEO <span>LIVE TV</span></div>
    <a href="https://www.appcreator24.com/app3955137-obzs8n" class="download-app-btn">تنزيل التطبيق</a>
</header>

<div class="search-area">
    <input type="text" id="searchInput" class="search-input" placeholder="بحث في الأفلام، المسلسلات، الأغاني..." oninput="handleSearch()">
</div>

<div class="glowing-btn-container">
    <a href="https://romeo311020.github.io/ROMEO-LIVE-TV-/" class="glowing-btn">
        <i>⚽📺</i>
        <span>شاهد المباريات والقنوات بث مباشر</span>
    </a>
</div>

<div class="hero-menu">
    <div class="main-btn" onclick="toggleSub('m-sub')"><i>🎥</i><span>الأفلام</span></div>
    <div class="main-btn" onclick="toggleSub('s-sub')"><i>📺</i><span>المسلسلات</span></div>
    <div class="main-btn" onclick="filterData('match', 'ملخصات المباريات'); hideAllSubs()"><i>⚽</i><span>المباريات</span></div>
    <div class="main-btn" onclick="filterData('music', 'أجمل الأغاني'); hideAllSubs()"><i>🎵</i><span>الأغاني</span></div>
</div>

<div id="m-sub" class="sub-menu">
    <div class="sub-item" onclick="filterData('egy1', 'أفلام مصرية 1')">أفلام مصرية 1</div>
    <div class="sub-item" onclick="filterData('egy2', 'أفلام مصرية 2')">أفلام مصرية 2</div>
    <div class="sub-item" style="grid-column: span 2;" onclick="filterData('christian', 'أفلام دينية مسيحية')">أفلام دينية مسيحية ✝️</div>
</div>

<div id="s-sub" class="sub-menu">
    <div class="sub-item" onclick="filterData('ramadan', 'رمضان 2026')">رمضان 2026</div>
    <div class="sub-item" onclick="filterData('arabic', 'مسلسلات مصرية')">مسلسلات مصرية</div>
</div>

<div class="section-title" id="gridTitle">المعروض الآن</div>
<div class="cards-grid" id="mainGrid"></div>

<div id="episodesView">
    <div class="back-nav-btn" onclick="document.getElementById('episodesView').style.display='none'">✕ رجوع</div>
    <h2 id="seriesHeader" style="margin-top: 60px; text-align: center; color: var(--accent);"></h2>
    <div class="ep-grid" id="episodesGrid"></div>
</div>

<!-- المشغل المحدث -->
<div id="playerView" class="player-view">
    <div class="back-nav-btn" onclick="closePlayer()">✕ إغلاق</div>
    
    <div class="video-wrapper">
        <div id="playerLoader" class="player-loader">جاري التحميل...</div>
        <div id="videoContainer"></div>
    </div>

    <div class="player-info-area">
        <div class="player-title-text" id="currentPlayingTitle">حصرياً على <span>ROMEO LIVE TV</span></div>
        <div class="servers-container" id="serversList">
            <!-- تظهر الأزرار هنا ديناميكياً -->
        </div>
    </div>
</div>

<div class="bottom-nav">
    <div class="nav-item active" onclick="location.reload()"><i>🏠</i><span>الرئيسية</span></div>
    <div class="nav-item" onclick="showFavorites()"><i>❤️</i><span>المفضلة</span></div>
    <div class="nav-item" onclick="window.location.href='https://romeo311020.github.io/ROMEO-MATCH/'"><i>⚽</i><span>المباريات</span></div>
    <div class="nav-item" onclick="window.open('https://wa.me/201286716976')"><i>💬</i><span>اطلب</span></div>
</div>

<script>
    let database = [];
    let currentItemName = "";

    async function loadData() {
        try {
            const response = await fetch('data.json');
            const data = await response.json();
            database = data.items || []; 
            render(database);
        } catch (e) { document.getElementById('gridTitle').innerText = "خطأ في الاتصال"; }
    }

    function render(data) {
        const grid = document.getElementById('mainGrid');
        grid.innerHTML = '';
        data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<img src="${item.img}"><div class="card-info">${item.name}</div>`;
            card.onclick = () => {
                if(item.type === 'series') openEpisodes(item);
                else openPlayer(item);
            };
            grid.appendChild(card);
        });
    }

    function openEpisodes(item) {
        document.getElementById('episodesView').style.display = 'flex';
        document.getElementById('seriesHeader').innerText = item.name;
        const grid = document.getElementById('episodesGrid');
        grid.innerHTML = '';
        if(item.episodes) {
            item.episodes.forEach(ep => {
                const div = document.createElement('div');
                div.className = 'ep-item';
                div.innerText = ep.name || `الحلقة ${ep.num}`;
                // نمرر كائن الحلقة كأنه item للمشغل
                div.onclick = () => openPlayer({ name: `${item.name} - ${ep.name || 'الحلقة ' + ep.num}`, link: ep.link, servers: ep.servers });
                grid.appendChild(div);
            });
        }
    }

    // الدالة المحدثة لتشغيل الفيديو ودعم السيرفرات
    function openPlayer(item) {
        const playerView = document.getElementById('playerView');
        const serversList = document.getElementById('serversList');
        const titleArea = document.getElementById('currentPlayingTitle');
        
        currentItemName = item.name;
        playerView.style.display = 'flex';
        titleArea.innerHTML = `حصرياً <span>(${item.name})</span> على ROMEO LIVE TV`;
        
        serversList.innerHTML = ''; // تنظيف الأزرار السابقة

        // التحقق من وجود سيرفرات متعددة
        if (item.servers && Array.isArray(item.servers) && item.servers.length > 0) {
            // استعادة آخر سيرفر تم اختياره لهذا المحتوى
            const savedServer = localStorage.getItem(`last_srv_${item.name}`) || 0;
            
            item.servers.forEach((srv, index) => {
                const btn = document.createElement('button');
                btn.className = `server-btn ${index == savedServer ? 'active' : ''}`;
                btn.innerText = `سيرفر ${index + 1}`;
                btn.onclick = () => switchServer(srv, index, btn);
                serversList.appendChild(btn);
            });
            
            // تشغيل السيرفر المحفوظ أو الأول
            loadIframe(item.servers[savedServer]);
        } else {
            // تشغيل الرابط الفردي كالمعتاد
            loadIframe(item.link);
        }
    }

    // دالة تغيير السيرفر مع الأنيميشن
    function switchServer(link, index, btnElement) {
        const allBtns = document.querySelectorAll('.server-btn');
        const iframe = document.querySelector('#videoContainer iframe');
        const loader = document.getElementById('playerLoader');

        // تحديث حالة الأزرار
        allBtns.forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');

        // حفظ الاختيار
        localStorage.setItem(`last_srv_${currentItemName}`, index);

        // أنيميشن الخروج
        if(iframe) iframe.classList.add('iframe-loading');
        loader.style.display = 'block';

        setTimeout(() => {
            loadIframe(link);
        }, 300);
    }

    // دالة بناء الـ Iframe
    function loadIframe(link) {
        const container = document.getElementById('videoContainer');
        const loader = document.getElementById('playerLoader');
        
        container.innerHTML = `
            <iframe src="${link}" allowfullscreen sandbox="allow-forms allow-pointer-lock allow-same-origin allow-scripts allow-top-navigation" onload="onIframeLoad(this)"></iframe>
        `;
    }

    // عند اكتمال تحميل الـ Iframe
    function onIframeLoad(iframe) {
        const loader = document.getElementById('playerLoader');
        iframe.classList.remove('iframe-loading');
        loader.style.display = 'none';
    }

    function closePlayer() {
        document.getElementById('playerView').style.display = 'none';
        document.getElementById('videoContainer').innerHTML = '';
        document.getElementById('serversList').innerHTML = '';
    }

    function toggleSub(id) {
        const menu = document.getElementById(id);
        const isVisible = menu.style.display === 'grid';
        hideAllSubs();
        menu.style.display = isVisible ? 'none' : 'grid';
    }

    function hideAllSubs() { document.querySelectorAll('.sub-menu').forEach(m => m.style.display = 'none'); }

    function filterData(cat, title) {
        document.getElementById('gridTitle').innerText = title;
        render(database.filter(i => i.cat === cat));
        hideAllSubs();
    }

    function handleSearch() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        render(database.filter(i => i.name.toLowerCase().includes(q)));
    }

    loadData();
</script>
</body>
</html>
