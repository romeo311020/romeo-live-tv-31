<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𝑹𝑶𝑴𝑬𝑶 𝑳𝑰𝑽𝑬 𝑻𝑽</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --main-bg: #050811;
            --accent: #e5b80b;
            --card-bg: #101628;
            --grad: linear-gradient(135deg, #e5b80b 0%, #b8860b 100%);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: var(--main-bg); color: #fff; overflow-x: hidden; }

        /* Header */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 5%; background: rgba(2, 6, 23, 0.95); backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 1000; border-bottom: 2px solid var(--accent);
        }
        .logo-box { display: flex; align-items: center; gap: 15px; }
        .site-logo { width: 42px; height: 42px; background: var(--accent); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #000; box-shadow: 0 0 15px var(--accent); font-size: 22px; }
        .logo-text { font-weight: 800; font-size: 1.3rem; color: var(--accent); text-shadow: 0 0 5px rgba(229, 184, 11, 0.3); }
        .app-btn { background: rgba(255,255,255,0.05); padding: 8px 18px; border-radius: 25px; color: #fff; text-decoration: none; font-size: 13px; border: 1.5px solid var(--accent); transition: 0.3s; font-weight: 600; }
        .app-btn:hover { background: var(--accent); color: #000; box-shadow: 0 0 10px var(--accent); }

        /* Search Bar */
        .search-area { padding: 20px 5%; }
        .search-wrapper { position: relative; max-width: 600px; margin: 0 auto; }
        .search-input { width: 100%; background: #161d2f; border: 1px solid #2d3748; padding: 14px 45px 14px 20px; border-radius: 12px; color: #fff; outline: none; transition: 0.3s; }
        .search-icon { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--accent); }

        /* Hero Menu */
        .hero-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 10px 5%; }
        .main-btn { height: 75px; border-radius: 15px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: var(--transition); font-weight: 800; font-size: 20px; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        .movies-btn { background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%); }
        .series-btn { background: linear-gradient(135deg, #6d28d9 0%, #4c1d95 100%); }
        .main-btn:hover { transform: translateY(-5px); filter: brightness(1.2); }

        /* Sub Menu */
        .sub-menu { display: none; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; padding: 15px 5%; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from {opacity: 0; transform: translateY(-10px);} to {opacity: 1; transform: translateY(0);} }
        .sub-item { background: #1a2236; padding: 12px; border-radius: 10px; text-align: center; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; font-size: 14px; font-weight: 600; transition: 0.3s; }
        .sub-item:hover { border-color: var(--accent); color: var(--accent); background: #242d45; }

        /* Section Title */
        .section-title { padding: 25px 5% 15px; font-size: 20px; color: #fff; display: flex; align-items: center; gap: 10px; font-weight: 800; }
        .section-title::before { content: ''; width: 5px; height: 25px; background: var(--accent); border-radius: 3px; }
        
        /* Cards Grid */
        .cards-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; padding: 10px 5% 120px; }
        @media (min-width: 768px) { .cards-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); } }

        .card { background: var(--card-bg); border-radius: 15px; overflow: hidden; position: relative; transition: 0.3s; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
        .card:hover { transform: scale(1.05); border-color: var(--accent); box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
        .card img { width: 100%; height: 260px; object-fit: cover; transition: 0.3s; }
        
        .fav-tag { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 50%; cursor: pointer; z-index: 5; transition: 0.3s; }
        .fav-tag.active { color: #ff4757; background: #fff; }

        .card-info { position: absolute; bottom: 0; width: 100%; padding: 20px 5px 10px; background: linear-gradient(transparent, rgba(0,0,0,0.9)); text-align: center; font-size: 14px; font-weight: bold; color: #fff; }

        /* Player View */
        .player-view { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 2000; display: none; }
        .close-btn { position: absolute; top: 20px; right: 20px; padding: 10px 20px; background: var(--accent); color: #000; border-radius: 20px; cursor: pointer; font-weight: 800; z-index: 2100; }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: rgba(10, 15, 30, 0.95); display: flex; justify-content: space-around; padding: 12px; border-top: 1px solid rgba(229, 184, 11, 0.3); backdrop-filter: blur(10px); }
        .nav-item { text-align: center; font-size: 11px; color: #888; cursor: pointer; transition: 0.3s; }
        .nav-item i { font-size: 22px; display: block; color: #fff; margin-bottom: 2px; }
        .nav-item.active { color: var(--accent); }
        .nav-item.active i { color: var(--accent); }
    </style>
</head>
<body>

<header>
    <div class="logo-box">
        <div class="site-logo">R</div>
        <div class="logo-text">𝑹𝑶𝑴𝑬𝑶 𝑳𝑰𝑽𝑬 𝑻𝑽</div>
    </div>
    <a href="https://www.appcreator24.com/app3955137-obzs8n" class="app-btn">تنزيل التطبيق 📲</a>
</header>

<div class="search-area">
    <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن فيلم أو مسلسل..." oninput="handleSearch()">
    </div>
</div>

<div class="hero-menu">
    <div class="main-btn movies-btn" onclick="toggleSub('m-sub')">🎥 الأفلام</div>
    <div class="main-btn series-btn" onclick="toggleSub('s-sub')">📺 المسلسلات</div>
</div>

<div id="m-sub" class="sub-menu">
    <div class="sub-item" onclick="filterData('egy1', 'أفلام مصرية 1')">أفلام مصرية 1</div>
    <div class="sub-item" onclick="filterData('egy2', 'أفلام مصرية 2')">أفلام مصرية 2</div>
    <div class="sub-item" onclick="alert('سيتم اضافة قريبا')">أفلام أجنبية 🔒</div>
</div>

<div id="s-sub" class="sub-menu">
    <div class="sub-item" onclick="filterData('ramadan', 'رمضان 2026')">رمضان 2026</div>
    <div class="sub-item" onclick="filterData('arabic', 'مسلسلات مصرية')">مسلسلات مصرية</div>
    <div class="sub-item" onclick="alert('سيتم اضافة قريبا')">مسلسلات أجنبية 🔒</div>
</div>

<div class="section-title" id="gridTitle">المعروض الآن</div>
<div class="cards-grid" id="mainGrid"></div>

<div id="playerView" class="player-view">
    <div class="close-btn" onclick="closePlayer()">إغلاق وتراجع ✕</div>
    <div id="videoContainer" style="height: 100%; display: flex; align-items: center; justify-content: center;"></div>
</div>

<div class="bottom-nav">
    <div class="nav-item active" onclick="location.reload()"><i>🏠</i>الرئيسية</div>
    <div class="nav-item" onclick="showFavorites()"><i>❤️</i>المفضلة</div>
    <div class="nav-item" onclick="window.location.href='https://romeo311020.github.io/ROMEO-MATCH/'"><i>⚽</i>المباريات</div>
    <div class="nav-item" onclick="window.open('https://wa.me/201286716976')"><i>💬</i>اطلب</div>
</div>

<script>
    // تعديل: جلب البيانات من ملف JSON الخارجي بدلاً من كتابتها هنا
    let database = [];
    let favorites = JSON.parse(localStorage.getItem('romeo_favs')) || [];

    async function loadData() {
        try {
            const response = await fetch('data.json');
            database = await response.json();
            render(database);
        } catch (e) {
            console.log("Error loading data.json");
        }
    }

    function render(data) {
        const grid = document.getElementById('mainGrid');
        grid.innerHTML = '';
        data.forEach(item => {
            const isFav = favorites.includes(item.id);
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="fav-tag ${isFav ? 'active' : ''}" onclick="toggleFav(event, ${item.id})">❤</div>
                <img src="${item.img}" loading="lazy">
                <div class="card-info">${item.name}</div>
            `;
            card.onclick = () => playMedia(item);
            grid.appendChild(card);
        });
    }

    function toggleSub(id) {
        const menu = document.getElementById(id);
        const all = document.querySelectorAll('.sub-menu');
        const isVisible = menu.style.display === 'grid';
        all.forEach(m => m.style.display = 'none');
        menu.style.display = isVisible ? 'none' : 'grid';
    }

    function filterData(cat, title) {
        document.getElementById('gridTitle').innerText = title;
        render(database.filter(i => i.cat === cat));
        document.querySelectorAll('.sub-menu').forEach(m => m.style.display = 'none');
    }

    function handleSearch() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        const res = database.filter(i => i.name.toLowerCase().includes(q));
        render(res);
    }

    function toggleFav(e, id) {
        e.stopPropagation();
        if(favorites.includes(id)) favorites = favorites.filter(f => f !== id);
        else favorites.push(id);
        localStorage.setItem('romeo_favs', JSON.stringify(favorites));
        e.target.classList.toggle('active');
    }

    function showFavorites() {
        document.getElementById('gridTitle').innerText = "قائمة المفضلات ❤️";
        render(database.filter(i => favorites.includes(i.id)));
    }

    function playMedia(item) {
        // التحقق مما إذا كان الرابط يحتوي على كلمة embed (يوتيوب)
        if(item.link.includes('embed')) {
            document.getElementById('playerView').style.display = 'block';
            document.getElementById('videoContainer').innerHTML = `<iframe src="${item.link}" width="100%" height="300px" frameborder="0" allowfullscreen></iframe>`;
        } else {
            window.location.href = item.link;
        }
    }

    function closePlayer() {
        document.getElementById('playerView').style.display = 'none';
        document.getElementById('videoContainer').innerHTML = '';
    }

    // بدء التحميل
    loadData();
</script>

</body>
</html>
