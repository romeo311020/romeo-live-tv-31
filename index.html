<!DOCTYPE html>

<meta charset="UTF-8">
<title>ROMEO LIVE TV</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
font-family:Arial;
color:white;
text-align:center;
display:flex;
justify-content:center;
align-items:flex-start;
padding-top:100px;
height:100vh;
overflow:hidden;
background:#000;
animation:fadein 2s;
}

/* حركة دخول الصفحة */

@keyframes fadein{
from{opacity:0; transform:scale(1.05)}
to{opacity:1; transform:scale(1)}
}

/* الخلفية السينمائية */

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:
radial-gradient(circle at bottom,#ffd70055,transparent 70%),
linear-gradient(#5a0000,#1a0000);
animation:bgmove 8s infinite alternate;
z-index:-1;
}

@keyframes bgmove{
from{filter:brightness(1)}
to{filter:brightness(1.2)}
}

/* اللوجو */

.logo{
font-size:70px;
margin-bottom:10px;
text-shadow:
0 0 10px #fff,
0 0 20px #ffd700,
0 0 40px #ffd700;
animation:float 3s infinite ease-in-out;
}

@keyframes float{
0%{transform:translateY(0)}
50%{transform:translateY(-8px)}
100%{transform:translateY(0)}
}

/* العنوان مع اللمعة */

h1{
font-size:45px;
margin-bottom:20px;
position:relative;
text-shadow:
0 0 10px #fff,
0 0 20px #ffd700;
overflow:hidden;
}

h1::after{
content:"";
position:absolute;
top:0;
left:-100%;
width:100%;
height:100%;
background:linear-gradient(120deg,transparent,rgba(255,255,255,0.8),transparent);
animation:shine 4s infinite;
}

@keyframes shine{
0%{left:-100%}
100%{left:100%}
}

/* مربع الوصف */

.desc{
max-width:600px;
margin:auto;
padding:20px;
background:rgba(255,255,255,0.08);
border-radius:12px;
font-size:18px;
box-shadow:0 10px 30px rgba(0,0,0,0.5);
margin-bottom:50px;
animation:fadeup 1.5s;
}

@keyframes fadeup{
from{opacity:0; transform:translateY(40px)}
to{opacity:1; transform:translateY(0)}
}

/* الأزرار */

.buttons{
display:flex;
flex-direction:column;
gap:30px;
align-items:center;
}

.btn{
padding:18px 65px;
font-size:21px;
color:white;
text-decoration:none;
border-radius:12px;
font-weight:bold;
background:linear-gradient(145deg,#caa300,#8b6a00);
box-shadow:
0 6px 20px rgba(0,0,0,0.6),
0 0 20px #ffd70066;
transition:0.3s;
animation:fadeup 2s;
}

.btn:hover{
transform:scale(1.1);
box-shadow:0 0 35px #ffd700;
}

/* زر واتساب */

.whatsapp{
position:fixed;
bottom:25px;
right:25px;
width:65px;
height:65px;
background:#25D366;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
box-shadow:0 0 20px rgba(0,0,0,0.5);
transition:0.3s;
animation:pulse 2s infinite;
}

.whatsapp img{
width:35px;
}

.whatsapp:hover{
transform:scale(1.1);
}

/* نبض زر واتساب */

@keyframes pulse{
0%{box-shadow:0 0 0 0 rgba(37,211,102,0.7)}
70%{box-shadow:0 0 0 15px rgba(37,211,102,0)}
100%{box-shadow:0 0 0 0 rgba(37,211,102,0)}
}

/* النص السفلي */

.footer{
position:fixed;
bottom:10px;
left:0;
right:0;
font-size:16px;
text-shadow:
0 0 5px #fff,
0 0 10px #ffd700;
}

/* الموبايل */

@media(max-width:768px){

.logo{font-size:45px}

h1{font-size:30px}

.btn{
font-size:18px;
padding:15px 50px
}

}

</style>
</head>
