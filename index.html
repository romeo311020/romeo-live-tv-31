<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROMEO LIVE TV</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        /* --- الأساسيات الأصلية (بدون تغيير نهائياً) --- */
        :root {
            --main-bg: #040714;
            --accent: #e5b80b;
            --accent-glow: rgba(229, 184, 11, 0.5);
            --card-bg: #1a1d29;
            --glass: rgba(15, 20, 35, 0.8);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--main-bg); color: #fff; overflow-x: hidden; font-size: 13px; transition: background 0.5s; }

        header {
            padding: 8px 5%; background: rgba(4, 7, 20, 0.95); backdrop-filter: blur(10px);
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid rgba(229, 184, 11, 0.2);
        }
        .logo-text { font-weight: 900; font-size: 1rem; color: #fff; }
        .logo-text span { color: var(--accent); }
        
        .download-app-btn {
            background: linear-gradient(45deg, var(--accent), #ffea00);
            color: #000; padding: 5px 12px; border-radius: 15px;
            font-size: 10px; font-weight: 800; text-decoration: none;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .search-area { padding: 10px 5% 5px; }
        .search-input { 
            width: 100%; background: #1a1d29; border: 1px solid rgba(255,255,255,0.1); 
            padding: 8px 15px; border-radius: 8px; color: #fff; outline: none; font-size: 12px;
        }

        .glowing-btn-container { padding: 15px 5% 5px; text-align: center; }
        .glowing-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            background: linear-gradient(90deg, #ffea00, var(--accent), #ffea00);
            background-size: 200% auto;
            color: #000; padding: 10px 20px; border-radius: 25px;
            font-size: 12px; font-weight: 800; text-decoration: none;
            box-shadow: 0 0 15px var(--accent-glow);
            transition: var(--transition);
            animation: glow-pulse 2s infinite, gradient-move 3s linear infinite;
        }
        @keyframes glow-pulse { 0%, 100% { box-shadow: 0 0 10px var(--accent-glow); } 50% { box-shadow: 0 0 20px var(--accent-glow); } }
        @keyframes gradient-move { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }

        .hero-menu { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 10px 5%; }
        .main-btn { 
            height: 60px; border-radius: 10px; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; cursor: pointer; 
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05);
            font-size: 10px; font-weight: 700; transition: var(--transition);
        }
        .main-btn i { font-size: 18px; margin-bottom: 2px; }

        .sub-menu { display: none; grid-template-columns: repeat(2, 1fr); gap: 6px; padding: 5px 5%; animation: slideDown 0.3s ease; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        .sub-item { background: #1a1d29; padding: 8px; border-radius: 6px; text-align: center; font-size: 10px; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); color: #ccc; }

        .section-title { padding: 15px 5% 5px; font-size: 14px; font-weight: 800; color: var(--accent); }
        .cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px 5% 100px; }
        @media (min-width: 768px) { .cards-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); } }

        .card { 
            background: var(--card-bg); border-radius: 8px; overflow: hidden; 
            position: relative; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.6s; border: 1px solid rgba(255,255,255,0.03);
            cursor: pointer;
        }
        .card img { width: 100%; height: 140px; object-fit: cover; }
        .card-info { padding: 5px 4px; background: rgba(0,0,0,0.85); text-align: center; font-size: 9px; font-weight: 700; }

        /* --- واجهة الحلقات --- */
        #episodesView {
            position: fixed; inset: 0; background: var(--main-bg); z-index: 1500; display: none;
            flex-direction: column; padding: 20px; overflow-y: auto;
        }
        .ep-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 20px; }
        .ep-item { 
            background: #1a1d29; border: 1px solid var(--accent); padding: 15px; 
            border-radius: 10px; text-align: center; font-weight: 800; cursor: pointer;
        }

        /* --- المشغل الأصلي --- */
        .player-view { 
            position: fixed; inset: 0; background: #000; z-index: 2000; display: none;
            flex-direction: column; align-items: center; justify-content: center;
        }
        .video-wrapper { width: 92%; max-width: 1000px; border-radius: 15px; overflow: hidden; }
        iframe { width: 100%; aspect-ratio: 16/9; border: none; }
        .back-nav-btn {
            position: absolute; top: 20px; left: 20px; background: var(--accent);
            padding: 8px 20px; border-radius: 30px; cursor: pointer; font-weight: 800; color: #000;
        }

        .bottom-nav { 
            position: fixed; bottom: 12px; left: 5%; right: 5%; height: 58px;
            background: var(--glass); backdrop-filter: blur(15px);
            display: flex; justify-content: space-around; align-items: center;
            border-radius: 18px; border: 1px solid rgba(229, 184, 11, 0.4); z-index: 1000;
        }
        .nav-item { text-align: center; color: rgba(255,255,255,0.5); cursor: pointer; flex: 1; }
        .nav-item i { font-size: 20px; display: block; }
        .nav-item.active { color: var(--accent); }

        /* ======================================================
           ✨ إضافات UI & Animation الجديدة (Add Only)
           ====================================================== */

        /* تحسينات عامة وتأثير الزووم في الخلفية */
        html { scroll-behavior: smooth; }
        body::before {
            content: ''; position: fixed; inset: 0; z-index: -2;
            background: radial-gradient(circle at center, #111421 0%, #040714 100%);
            animation: bgZoom 20s infinite alternate ease-in-out;
        }
        @keyframes bgZoom { from { transform: scale(1); } to { transform: scale(1.1); } }

        /* أنيميشن كروت الأفلام */
        .card { opacity: 0; transform: translateY(30px); }
        .card.reveal { opacity: 1; transform: translateY(0); }
        .card:hover {
            transform: translateY(-12px) scale(1.06) !important;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), 0 0 20px var(--accent-glow);
            z-index: 10;
        }
        .card img { transition: transform 0.5s ease; }
        .card:hover img { transform: scale(1.1); }

        /* تحسين المشغل - Cinema Mode */
        .player-view { 
            backdrop-filter: blur(25px); background: rgba(0,0,0,0.85); 
            transition: opacity 0.4s ease;
        }
        .video-wrapper {
            transform: scale(0.95); opacity: 0;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 50px rgba(0,0,0,0.9), 0 0 30px var(--accent-glow);
        }
        .player-view.active .video-wrapper { transform: scale(1); opacity: 1; }

        /* خلفية المشغل الديناميكية */
        .player-premium-bg {
            position: absolute; inset: 0; z-index: -1;
            background-size: cover; background-position: center;
            filter: blur(45px) brightness(0.2); opacity: 0.8;
        }

        /* تحسين أزرار السيرفرات والحلقات */
        .server-pill {
            padding: 8px 22px; border-radius: 50px; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1); color: #fff; cursor: pointer;
            transition: all 0.3s ease; font-weight: 700;
        }
        .server-pill:hover { background: rgba(255,255,255,0.2); transform: scale(1.1); }
        .server-pill.active { background: var(--accent); color: #000; box-shadow: 0 0 15px var(--accent-glow); }

        .premium-ep-card {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05);
            padding: 12px 20px; border-radius: 12px; cursor: pointer; transition: 0.3s;
            display: flex; justify-content: space-between; align-items: center;
        }
        .premium-ep-card:hover { background: rgba(255,255,255,0.08); transform: translateX(-5px); border-color: var(--accent); }
        .premium-ep-card.active { background: rgba(229, 184, 11, 0.15); border-color: var(--accent); }

        /* تأثير Ripple عند الضغط */
        .ripple {
            position: absolute; background: rgba(255,255,255,0.3); border-radius: 50%;
            transform: scale(0); animation: rippleEffect 0.6s linear; pointer-events: none;
        }
        @keyframes rippleEffect { to { transform: scale(4); opacity: 0; } }
    </style>
</head>
<body>

<header>
    <div class="logo-text">ROMEO <span>LIVE TV</span></div>
    <a href="https://www.appcreator24.com/app3955137-obzs8n" class="download-app-btn">تنزيل التطبيق</a>
</header>

<div class="search-area">
    <input type="text" id="searchInput" class="search-input" placeholder="بحث في الأفلام، المسلسلات، الأغاني..." oninput="handleSearch()">
</div>

<div class="glowing-btn-container">
    <a href="https://romeo311020.github.io/ROMEO-LIVE-TV-/" class="glowing-btn">
        <i>⚽📺</i>
        <span>شاهد المباريات والقنوات بث مباشر</span>
    </a>
</div>

<div class="hero-menu">
    <div class="main-btn" onclick="toggleSub('m-sub')"><i>🎥</i><span>الأفلام</span></div>
    <div class="main-btn" onclick="toggleSub('s-sub')"><i>📺</i><span>المسلسلات</span></div>
    <div class="main-btn" onclick="filterData('match', 'ملخصات المباريات'); hideAllSubs()"><i>⚽</i><span>المباريات</span></div>
    <div class="main-btn" onclick="filterData('music', 'أجمل الأغاني'); hideAllSubs()"><i>🎵</i><span>الأغاني</span></div>
</div>

<div id="m-sub" class="sub-menu">
    <div class="sub-item" onclick="filterData('egy1', 'أفلام مصرية 1')">أفلام مصرية 1</div>
    <div class="sub-item" onclick="filterData('egy2', 'أفلام مصرية 2')">أفلام مصرية 2</div>
    <div class="sub-item" style="grid-column: span 2;" onclick="filterData('christian', 'أفلام دينية مسيحية')">أفلام دينية مسيحية ✝️</div>
</div>

<div id="s-sub" class="sub-menu">
    <div class="sub-item" onclick="filterData('ramadan', 'رمضان 2026')">رمضان 2026</div>
    <div class="sub-item" onclick="filterData('arabic', 'مسلسلات مصرية')">مسلسلات مصرية</div>
</div>

<div class="section-title" id="gridTitle">المعروض الآن</div>
<div class="cards-grid" id="mainGrid"></div>

<!-- واجهة الحلقات -->
<div id="episodesView">
    <div class="back-nav-btn" onclick="document.getElementById('episodesView').style.display='none'">✕ رجوع</div>
    <h2 id="seriesHeader" style="margin-top: 60px; text-align: center; color: var(--accent);"></h2>
    <div class="ep-grid" id="episodesGrid"></div>
</div>

<!-- المشغل -->
<div id="playerView" class="player-view">
    <div class="back-nav-btn" onclick="closePlayer()">✕ إغلاق</div>
    
    <!-- طبقة المشغل الاحترافية الجديدة (Add Only) -->
    <div id="newPremiumUI" style="display:none; width:100%; height:100%; position:absolute; z-index:2005; flex-direction:column; align-items:center; overflow-y:auto; padding:20px; padding-top:60px;">
        <div class="player-premium-bg" id="dynamicBg"></div>
        <h2 style="font-size:20px; font-weight:900; margin-bottom:15px; text-align:center;">حصرياً <span id="dynTitle" style="color:var(--accent)"></span> على ROMEO TV</h2>
        
        <div style="display:flex; gap:10px; margin-bottom:20px; justify-content:center; flex-wrap:wrap;">
            <div class="server-pill active" onclick="switchSrv(this)">سيرفر 1</div>
            <div class="server-pill" onclick="switchSrv(this)">سيرفر 2</div>
            <div class="server-pill" onclick="switchSrv(this)">سيرفر 3</div>
        </div>

        <div class="video-wrapper" id="premiumVidBox"></div>

        <div id="dynEpBox" style="width:100%; max-width:600px; margin-top:30px; display:flex; flex-direction:column; gap:10px;"></div>
    </div>

    <div class="video-wrapper" id="videoContainer"></div>
</div>

<div class="bottom-nav">
    <div class="nav-item active" onclick="location.reload()"><i>🏠</i><span>الرئيسية</span></div>
    <div class="nav-item" onclick="showFavorites()"><i>❤️</i><span>المفضلة</span></div>
    <div class="nav-item" onclick="window.location.href='https://romeo311020.github.io/ROMEO-MATCH/'"><i>⚽</i><span>المباريات</span></div>
    <div class="nav-item" onclick="window.open('https://wa.me/201286716976')"><i>💬</i><span>اطلب</span></div>
</div>

<script>
    /* --- الكود الأصلي كما هو --- */
    let database = [];
    let favorites = JSON.parse(localStorage.getItem('romeo_favs')) || [];

    async function loadData() {
        try {
            const response = await fetch('data.json');
            const data = await response.json();
            database = data.items || []; 
            render(database);
        } catch (e) { document.getElementById('gridTitle').innerText = "خطأ في الاتصال"; }
    }

    function render(data) {
        const grid = document.getElementById('mainGrid');
        grid.innerHTML = '';
        data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<img src="${item.img}"><div class="card-info">${item.name}</div>`;
            card.onclick = () => {
                if(item.type === 'series') openEpisodes(item);
                else openPremiumPlayer(item, item.link);
            };
            grid.appendChild(card);
        });
        revealCards();
    }

    function openEpisodes(item) {
        document.getElementById('episodesView').style.display = 'flex';
        document.getElementById('seriesHeader').innerText = item.name;
        const grid = document.getElementById('episodesGrid');
        grid.innerHTML = '';
        if(item.episodes) {
            item.episodes.forEach(ep => {
                const div = document.createElement('div');
                div.className = 'ep-item';
                div.innerText = ep.name || `الحلقة ${ep.num}`;
                div.onclick = () => openPremiumPlayer(item, ep.link);
                grid.appendChild(div);
            });
        }
    }

    function openPlayer(link) {
        document.getElementById('playerView').style.display = 'flex';
        setTimeout(() => document.getElementById('playerView').classList.add('active'), 50);
        document.getElementById('videoContainer').innerHTML = `
            <iframe src="${link}" allowfullscreen sandbox="allow-forms allow-pointer-lock allow-same-origin allow-scripts allow-top-navigation"></iframe>
        `;
    }

    function closePlayer() {
        document.getElementById('playerView').classList.remove('active');
        document.getElementById('newPremiumUI').style.display = 'none';
        setTimeout(() => {
            document.getElementById('playerView').style.display = 'none';
            document.getElementById('videoContainer').innerHTML = '';
            document.getElementById('premiumVidBox').innerHTML = '';
        }, 400);
    }

    function toggleSub(id) {
        const menu = document.getElementById(id);
        const isVisible = menu.style.display === 'grid';
        hideAllSubs();
        menu.style.display = isVisible ? 'none' : 'grid';
    }

    function hideAllSubs() { document.querySelectorAll('.sub-menu').forEach(m => m.style.display = 'none'); }

    function filterData(cat, title) {
        document.getElementById('gridTitle').innerText = title;
        render(database.filter(i => i.cat === cat));
        hideAllSubs();
    }

    function handleSearch() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        render(database.filter(i => i.name.toLowerCase().includes(q)));
    }

    loadData();

    /* ======================================================
       🚀 دوال الأنيميشن والتشغيل الجديدة (Add Only)
       ====================================================== */

    function revealCards() {
        const cards = document.querySelectorAll('.card');
        const observer = new IntersectionObserver(entries => {
            entries.forEach(entry => {
                if(entry.isIntersecting) entry.target.classList.add('reveal');
            });
        }, { threshold: 0.1 });
        cards.forEach(c => observer.observe(c));
    }

    function openPremiumPlayer(item, link) {
        const ui = document.getElementById('newPremiumUI');
        ui.style.display = 'flex';
        document.getElementById('dynamicBg').style.backgroundImage = `url('${item.img}')`;
        document.getElementById('dynTitle').innerText = item.name;
        
        document.getElementById('playerView').style.display = 'flex';
        setTimeout(() => document.getElementById('playerView').classList.add('active'), 50);

        const vidBox = document.getElementById('premiumVidBox');
        vidBox.innerHTML = `<iframe src="${link}" allowfullscreen></iframe>`;

        const epBox = document.getElementById('dynEpBox');
        epBox.innerHTML = '';
        if(item.episodes) {
            item.episodes.forEach(ep => {
                const card = document.createElement('div');
                card.className = `premium-ep-card ${ep.link === link ? 'active' : ''}`;
                card.innerHTML = `<span>${ep.name || 'الحلقة ' + ep.num}</span> <span>▶</span>`;
                card.onclick = () => {
                    vidBox.innerHTML = `<iframe src="${ep.link}" style="animation:fadeIn 0.5s" allowfullscreen></iframe>`;
                    document.querySelectorAll('.premium-ep-card').forEach(c => c.classList.remove('active'));
                    card.classList.add('active');
                };
                epBox.appendChild(card);
            });
        }
    }

    function switchSrv(btn) {
        document.querySelectorAll('.server-pill').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        const frame = document.querySelector('#premiumVidBox iframe');
        const src = frame.src;
        frame.src = ''; 
        setTimeout(() => frame.src = src, 50); // إعادة تحميل للتبديل
    }

    // Ripple Effect Logic
    document.addEventListener('click', e => {
        const btn = e.target.closest('.main-btn, .sub-item, .ep-item, .server-pill, .premium-ep-card');
        if(btn) {
            const ripple = document.createElement('span');
            ripple.className = 'ripple';
            btn.appendChild(ripple);
            const rect = btn.getBoundingClientRect();
            ripple.style.left = `${e.clientX - rect.left - 25}px`;
            ripple.style.top = `${e.clientY - rect.top - 25}px`;
            setTimeout(() => ripple.remove(), 600);
        }
    });
</script>
</body>
</html>
