<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>ROMEO LIVE TV</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
body{
  margin:0;
  font-family:Arial;
  color:white;
  text-align:center;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  overflow:hidden;
  background:#0a1a3b;
  position:relative;
  padding:20px;
  box-sizing:border-box;
}

/* ضباب خفيف */
.fog{
  position:absolute;
  top:0; left:0; right:0; bottom:0;
  background: radial-gradient(circle, rgba(255,255,255,0.02), transparent 70%);
  z-index:0;
}

/* اللوجو في الوسط فوق العنوان */
.logo{
  width:100px;
  height:100px;
  border-radius:50%;
  background: linear-gradient(135deg,#1e90ff,#00bfff);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:28px;
  font-weight:bold;
  box-shadow:0 0 20px #00bfff;
  animation: logoPulse 2s infinite alternate;
  z-index:1;
  margin-bottom:10px;
  margin-left:auto;
  margin-right:auto;
}

@keyframes logoPulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.1);}
  100%{transform:scale(1);}
}

h1{
  font-size:45px;
  margin-bottom:20px;
  text-shadow:0 0 20px #1e90ff, 0 0 30px #00bfff;
  position:relative;
  animation: pulse 1.5s infinite;
  z-index:1;
}

h1::after{ content:''; }

@keyframes pulse{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.05);}
}

.desc{
  max-width:600px;
  margin:auto;
  padding:20px;
  background:rgba(10,26,59,0.8);
  border-radius:12px;
  font-size:18px;
  box-shadow:0 10px 25px rgba(0,0,0,0.4);
  margin-bottom:40px;
  backdrop-filter: blur(5px);
  position:relative;
  z-index:1;
}

.buttons{
  display:flex;
  flex-direction:column;
  gap:25px;
  align-items:center;
  position:relative;
  z-index:1;
}

.btn{
  padding:16px 60px;
  font-size:20px;
  color:white;
  text-decoration:none;
  border-radius:10px;
  font-weight:bold;
  background:#1e90ff;
  box-shadow:0 0 15px rgba(30,144,255,0.5);
  transition:0.3s;
  position:relative;
  overflow:hidden;
}

.btn:hover{
  background:#00bfff;
  transform:scale(1.08);
  box-shadow:0 0 25px #00bfff, 0 0 40px #00bfff, 0 0 60px #00bfff;
}

.btn-glow{ animation: glow 1.5s infinite alternate; }

@keyframes glow{
  0%{box-shadow:0 0 15px rgba(30,144,255,0.5);}
  50%{box-shadow:0 0 25px #00bfff;}
  100%{box-shadow:0 0 15px rgba(30,144,255,0.5);}
}

.whatsapp{
  position:fixed;
  bottom:25px;
  right:25px;
  width:65px;
  height:65px;
  background:#25D366;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 20px rgba(0,0,0,0.5);
  z-index:2;
}

.whatsapp img{ width:35px; }

/* الفوتو في الأسفل فوق الفوتر مع حركة */
.footer-name{
  position:fixed;
  bottom:30px;
  left:0;
  right:0;
  font-size:22px;
  color:#00bfff;
  font-weight:bold;
  z-index:1;
  animation: nameGlow 2s infinite alternate, floatUpDown 3s infinite ease-in-out;
}

@keyframes nameGlow{
  0%{text-shadow:0 0 5px #00bfff;}
  50%{text-shadow:0 0 15px #00bfff;}
  100%{text-shadow:0 0 5px #00bfff;}
}

@keyframes floatUpDown{
  0%,100%{transform: translateY(0px);}
  50%{transform: translateY(-8px);}
}

.footer{
  position:fixed;
  bottom:5px;
  left:0;
  right:0;
  font-size:15px;
  color:#cbd5e1;
  z-index:1;
}

/* نقاط متحركة */
.particle{
  position:absolute;
  width:4px;
  height:4px;
  background:white;
  border-radius:50%;
  box-shadow:0 0 6px #00bfff;
  opacity:0.7;
  animation: moveParticle linear infinite;
}

@media(max-width:768px){
  h1{font-size:30px}
  .btn{font-size:18px;padding:14px 45px}
  .footer-name{font-size:18px;}
}
</style>
</head>
<body>

<div class="fog"></div>
<div id="particles"></div>

<div>
  <!-- اللوجو في الوسط فوق العنوان -->
  <div class="logo">R</div>
  <h1>ROMEO LIVE TV</h1>

  <div class="desc">
    تابع القنوات المباشرة والمسلسلات والرياضة بجودة عالية وسرعة ممتازة عبر موقع ROMEO LIVE TV.
  </div>

  <div class="buttons">
    <a class="btn" href="https://romeo-live-online.lovable.app/dashboard">
      🎬 دخول
    </a>
    <a class="btn btn-glow" href="https://romeo311020.github.io/ROMEO-LIVE-TV.-apk1/">
      📱 تنزيل التطبيق
    </a>
  </div>

  <a class="whatsapp" href="https://api.whatsapp.com/send?phone=201286716976" target="_blank">
    <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png">
  </a>

  <!-- الفوتو في الأسفل فوق الفوتر -->
  <div class="footer-name">روماني جرجس ¶ كيرلس عياد</div>

  <div class="footer">
    ROMEO LIVE TV
  </div>
</div>

<script>
// إنشاء نقاط ديناميكية
const particleContainer = document.getElementById('particles');
const numParticles = 40;
for(let i=0;i<numParticles;i++){
  const p = document.createElement('div');
  p.classList.add('particle');
  p.style.top = Math.random()*window.innerHeight + 'px';
  p.style.left = Math.random()*window.innerWidth + 'px';
  const size = 2 + Math.random()*4;
  p.style.width = size+'px';
  p.style.height = size+'px';
  p.style.opacity = 0.4 + Math.random()*0.6;
  const duration = 10 + Math.random()*10;
  p.style.animationDuration = duration+'s';
  p.style.animationName = 'moveParticle';
  p.style.animationTimingFunction = 'linear';
  p.style.animationIterationCount = 'infinite';
  const xMove = Math.random()*200-100;
  p.style.transform = `translate(${xMove}px,0px)`;
  particleContainer.appendChild(p);
}

// keyframes للنقاط
const style = document.createElement('style');
style.innerHTML = `
@keyframes moveParticle{
  0%{transform: translate(0px, 0px);}
  100%{transform: translate(50px, -${window.innerHeight+100}px);}
}`;
document.head.appendChild(style);
</script>

</body>
</html>
