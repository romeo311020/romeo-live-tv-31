<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>ROMEO LIVE TV</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0; padding:0; box-sizing:border-box;}

body{
  font-family: Arial, sans-serif;
  background: linear-gradient(130deg,#0a0f26,#1b243b,#0d1124);
  background-size:400% 400%;
  animation: bgShift 15s ease infinite;
  color:#fff;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  text-align:center;
  overflow:hidden;
}

@keyframes bgShift{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

.particle{
  position:absolute;
  width:4px;
  height:4px;
  background:white;
  border-radius:50%;
  opacity:0.6;
  box-shadow:0 0 6px #00bfff;
  animation: moveParticle linear infinite;
}
@keyframes moveParticle{
  0%{transform: translate(0,0);}
  100%{transform: translate(50px, -100vh);}
}

.container{
  width:100%;
  max-width:380px;
  background:rgba(0,0,0,0.45);
  padding:25px 18px;
  border-radius:15px;
  box-shadow:0 0 25px rgba(0,0,0,0.6);
  backdrop-filter:blur(7px);
  position:relative;
  z-index:1;
}

.logo{
  width:110px;
  height:110px;
  margin:0 auto 15px auto;
  background:radial-gradient(circle,#ffcc00,#b38f00);
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:32px;
  font-weight:bold;
  color:#0a0f26;
  animation: logoGlow 2s infinite alternate;
}

@keyframes logoGlow{
  0%{box-shadow:0 0 10px #ffcc00;}
  50%{box-shadow:0 0 20px #ffcc00;}
  100%{box-shadow:0 0 10px #ffcc00;}
}

h1{
  font-size:30px;
  margin-bottom:12px;
  color:#ffcf41;
}

.desc{
  font-size:17px;
  margin-bottom:20px;
  color:#e0e0e0;
}

.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:14px;
  margin-top:12px;
  font-size:19px;
  text-decoration:none;
  width:100%;
  border-radius:8px;
  transition:0.3s;
  color:#fff;
}
.btn:hover{ transform:scale(1.05); }

.btn-login{ background:linear-gradient(90deg,#4e6ef2,#2c3ce6); }
.btn-music{ background:linear-gradient(90deg,#b45dee,#7b31d4); }
.btn-download{ background:linear-gradient(90deg,#26b5ff,#0c80c9); }

.footer{
  font-size:13px;
  margin-top:18px;
  color:#ccc;
}

.whatsapp{
  position:fixed;
  bottom:25px;
  right:25px;
  width:60px;
  height:60px;
  background:#25D366;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:2;
}
.whatsapp img{ width:32px; }

/* 🔥 الإعلان */
#adPopup{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.85);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:999;
}

.ad-box{
  width:90%;
  max-width:400px;
  position:relative;
}

.ad-box img{
  width:100%;
  border-radius:10px;
}

.close-btn{
  position:absolute;
  top:-35px;
  right:0;
  background:red;
  color:#fff;
  border:none;
  padding:5px 10px;
  cursor:pointer;
  border-radius:5px;
}
</style>
</head>

<body>

<div id="particles"></div>

<div class="container">
  <div class="logo">R</div>
  <h1>ROMEO LIVE TV</h1>

  <div class="desc">
  </div>

  <!-- 🔥 زرار الدخول مع إعلان -->
  <a href="#" onclick="showAd('https://romeo-live-online.lovable.app/dashboard')" class="btn btn-login">
    دخول الموقع
  </a>

  <a href="https://romeo311020.github.io/romeo-music-" class="btn btn-music">
    الأغاني 🔥
  </a>

  <a href="https://romeo311020.github.io/ROMEO-LIVE-TV.-apk1/" class="btn btn-download">
    تحميل التطبيق 📱
  </a>

  <div class="footer">Powered by ROMEO LIVE TV</div>
</div>

<a class="whatsapp" href="https://api.whatsapp.com/send?phone=201286716976" target="_blank">
  <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png">
</a>

<!-- 🔥 الإعلان -->
<div id="adPopup">
  <div class="ad-box">
    <button class="close-btn" onclick="closeAd()">✖</button>
    <img src="ad.jpg" alt="ad">
  </div>
</div>

<script>
// particles
const particleContainer = document.getElementById('particles');
for(let i=0;i<50;i++){
  const p=document.createElement('div');
  p.classList.add('particle');
  p.style.top=Math.random()*window.innerHeight+'px';
  p.style.left=Math.random()*window.innerWidth+'px';
  p.style.animationDuration=(8+Math.random()*12)+'s';
  particleContainer.appendChild(p);
}

let targetLink = "";

// يظهر الإعلان
function showAd(link){
  targetLink = link;
  document.getElementById("adPopup").style.display = "flex";
}

// يقفل ويروح للرابط
function closeAd(){
  document.getElementById("adPopup").style.display = "none";
  window.location.href = targetLink;
}
</script>

</body>
</html>
