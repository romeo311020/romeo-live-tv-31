<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROMEO LIVE TV</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        /* --- الأساسيات الأصلية (بدون تغيير) --- */
        :root {
            --main-bg: #040714;
            --accent: #e5b80b;
            --accent-glow: rgba(229, 184, 11, 0.5);
            --card-bg: #1a1d29;
            --glass: rgba(15, 20, 35, 0.8);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--main-bg); color: #fff; overflow-x: hidden; font-size: 13px; transition: background 0.5s; }

        header {
            padding: 8px 5%; background: rgba(4, 7, 20, 0.95); backdrop-filter: blur(10px);
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid rgba(229, 184, 11, 0.2);
        }
        .logo-text { font-weight: 900; font-size: 1rem; color: #fff; }
        .logo-text span { color: var(--accent); }
        
        .download-app-btn {
            background: linear-gradient(45deg, var(--accent), #ffea00);
            color: #000; padding: 5px 12px; border-radius: 15px;
            font-size: 10px; font-weight: 800; text-decoration: none;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .search-area { padding: 10px 5% 5px; }
        .search-input { 
            width: 100%; background: #1a1d29; border: 1px solid rgba(255,255,255,0.1); 
            padding: 8px 15px; border-radius: 8px; color: #fff; outline: none; font-size: 12px;
        }

        /* --- الزر المنير (تمت إعادته كما هو) --- */
        .glowing-btn-container { padding: 15px 5% 5px; text-align: center; }
        .glowing-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            background: linear-gradient(90deg, #ffea00, var(--accent), #ffea00);
            background-size: 200% auto;
            color: #000; padding: 10px 20px; border-radius: 25px;
            font-size: 12px; font-weight: 800; text-decoration: none;
            box-shadow: 0 0 15px var(--accent-glow);
            transition: var(--transition);
            animation: glow-pulse 2s infinite, gradient-move 3s linear infinite;
        }
        @keyframes glow-pulse { 0%, 100% { box-shadow: 0 0 10px var(--accent-glow); } 50% { box-shadow: 0 0 20px var(--accent-glow); } }
        @keyframes gradient-move { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }

        .hero-menu { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 10px 5%; }
        .main-btn { 
            height: 60px; border-radius: 10px; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; cursor: pointer; 
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05);
            font-size: 10px; font-weight: 700; transition: var(--transition);
        }
        .main-btn i { font-size: 18px; margin-bottom: 2px; }

        .sub-menu { display: none; grid-template-columns: repeat(2, 1fr); gap: 6px; padding: 5px 5%; animation: slideDown 0.3s ease; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        .sub-item { background: #1a1d29; padding: 8px; border-radius: 6px; text-align: center; font-size: 10px; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); color: #ccc; }

        .section-title { padding: 15px 5% 5px; font-size: 14px; font-weight: 800; color: var(--accent); }
        .cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px 5% 100px; }
        @media (min-width: 768px) { .cards-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); } }

        .card { 
            background: var(--card-bg); border-radius: 8px; overflow: hidden; 
            position: relative; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.6s; border: 1px solid rgba(255,255,255,0.03);
            cursor: pointer;
        }
        .card img { width: 100%; height: 140px; object-fit: cover; }
        .card-info { padding: 5px 4px; background: rgba(0,0,0,0.85); text-align: center; font-size: 9px; font-weight: 700; }

        /* --- تحسينات تجربة المشغل الاحترافية (جديد) --- */
        .player-view { 
            position: fixed; inset: 0; background: #000; z-index: 2000; display: none;
            flex-direction: column; align-items: center; justify-content: center;
            animation: playerFadeIn 0.5s ease forwards;
        }
        .player-bg {
            position: absolute; inset: 0; background-size: cover; background-position: center;
            filter: blur(45px) brightness(0.3); transform: scale(1.1); z-index: -1;
        }
        .player-overlay-gradient {
            position: absolute; inset: 0;
            background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.9) 100%); z-index: -1;
        }
        .video-wrapper {
            width: 92%; max-width: 1000px; border-radius: 15px; overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.9);
            animation: slideUpReveal 0.8s 0.2s cubic-bezier(0.2, 1, 0.3, 1) forwards;
            opacity: 0;
        }
        iframe, video { width: 100%; aspect-ratio: 16/9; border: none; display: block; }
        
        .player-footer { margin-top: 25px; text-align: center; animation: fadeIn 1s 0.6s forwards; opacity: 0; }
        .player-poster { width: 70px; height: 100px; border-radius: 8px; object-fit: cover; margin-bottom: 12px; border: 2px solid rgba(255,255,255,0.15); }
        .player-title { 
            font-size: 15px; font-weight: 900; background: linear-gradient(to bottom, #fff, var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .back-nav-btn {
            position: absolute; top: 20px; left: 20px; background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px); padding: 8px 20px; border-radius: 30px;
            cursor: pointer; border: 1px solid rgba(255,255,255,0.2); font-weight: 800; color: #fff;
        }

        /* أنيميشن */
        @keyframes playerFadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUpReveal { from { opacity: 0; transform: translateY(40px) scale(0.9); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .card-clicked { transform: scale(1.4) !important; opacity: 0 !important; }

        /* البار السفلي الأصلي */
        .bottom-nav { 
            position: fixed; bottom: 12px; left: 5%; right: 5%; height: 58px;
            background: var(--glass); backdrop-filter: blur(15px);
            display: flex; justify-content: space-around; align-items: center;
            border-radius: 18px; border: 1px solid rgba(229, 184, 11, 0.4); z-index: 1000;
        }
        .nav-item { text-align: center; color: rgba(255,255,255,0.5); cursor: pointer; flex: 1; }
        .nav-item i { font-size: 20px; display: block; }
        .nav-item.active { color: var(--accent); }
    </style>
</head>
<body>

<header>
    <div class="logo-text">ROMEO <span>LIVE TV</span></div>
    <a href="https://www.appcreator24.com/app3955137-obzs8n" class="download-app-btn">تنزيل التطبيق</a>
</header>

<div class="search-area">
    <input type="text" id="searchInput" class="search-input" placeholder="بحث في الأفلام، المسلسلات، الأغاني..." oninput="handleSearch()">
</div>

<div class="glowing-btn-container">
    <a href="https://romeo311020.github.io/ROMEO-LIVE-TV-/" class="glowing-btn">
        <i style="color:#000">⚽📺</i>
        <span>شاهد المباريات والقنوات بث مباشر</span>
    </a>
</div>

<div class="hero-menu">
    <div class="main-btn" onclick="toggleSub('m-sub')"><i style="color:#3b82f6">🎥</i><span>الأفلام</span></div>
    <div class="main-btn" onclick="toggleSub('s-sub')"><i style="color:#a855f7">📺</i><span>المسلسلات</span></div>
    <div class="main-btn" onclick="filterData('match', 'ملخصات المباريات'); hideAllSubs()"><i style="color:#22c55e">⚽</i><span>المباريات</span></div>
    <div class="main-btn" onclick="filterData('music', 'أجمل الأغاني'); hideAllSubs()"><i style="color:#f43f5e">🎵</i><span>الأغاني</span></div>
</div>

<div id="m-sub" class="sub-menu">
    <div class="sub-item" onclick="filterData('egy1', 'أفلام مصرية 1')">أفلام مصرية 1</div>
    <div class="sub-item" onclick="filterData('egy2', 'أفلام مصرية 2')">أفلام مصرية 2</div>
    <div class="sub-item" style="grid-column: span 2;" onclick="filterData('christian', 'أفلام دينية مسيحية')">أفلام دينية مسيحية ✝️</div>
</div>

<div id="s-sub" class="sub-menu">
    <div class="sub-item" onclick="filterData('ramadan', 'رمضان 2026')">رمضان 2026</div>
    <div class="sub-item" onclick="filterData('arabic', 'مسلسلات مصرية')">مسلسلات مصرية</div>
</div>

<div class="section-title" id="gridTitle">المعروض الآن</div>
<div class="cards-grid" id="mainGrid"></div>

<div id="playerView" class="player-view">
    <div class="player-bg" id="playerBg"></div>
    <div class="player-overlay-gradient"></div>
    <div class="back-nav-btn" onclick="closePlayer()">✕ رجوع</div>

    <div class="video-wrapper">
        <div id="videoContainer"></div>
    </div>

    <div class="player-footer">
        <img id="footerPoster" class="player-poster" src="">
        <div class="player-title" id="footerTitle"></div>
        <div style="font-size: 10px; color: rgba(255,255,255,0.5); margin-top: 5px;">ROMEO LIVE TV PREMIUM</div>
    </div>
</div>

<div class="bottom-nav">
    <div class="nav-item active" onclick="location.reload()"><i>🏠</i><span>الرئيسية</span></div>
    <div class="nav-item" onclick="showFavorites()"><i>❤️</i><span>المفضلة</span></div>
    <div class="nav-item" onclick="window.location.href='https://romeo311020.github.io/ROMEO-MATCH/'"><i>⚽</i><span>المباريات</span></div>
    <div class="nav-item" onclick="window.open('https://wa.me/201286716976')"><i>💬</i><span>اطلب</span></div>
</div>

<script>
    let database = [];
    let favorites = JSON.parse(localStorage.getItem('romeo_favs')) || [];

    async function loadData() {
        try {
            const response = await fetch('data.json');
            const result = await response.json();
            database = Array.isArray(result) ? result : (result.items || []);
            render(database);
        } catch (e) { document.getElementById('gridTitle').innerText = "خطأ في الاتصال"; }
    }

    function render(data) {
        const grid = document.getElementById('mainGrid');
        grid.innerHTML = '';
        data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <img src="${item.img}" loading="lazy" onerror="this.src='https://via.placeholder.com/150x200?text=ROMEO'">
                <div class="card-info">${item.name}</div>
            `;
            card.onclick = () => startStreaming(card, item);
            grid.appendChild(card);
        });
    }

    function startStreaming(card, item) {
        card.classList.add('card-clicked');
        setTimeout(() => {
            openPlayer(item);
            card.classList.remove('card-clicked');
        }, 600);
    }

    function openPlayer(item) {
        const pv = document.getElementById('playerView');
        const container = document.getElementById('videoContainer');
        document.getElementById('playerBg').style.backgroundImage = `url(${item.img})`;
        document.getElementById('footerPoster').src = item.img;
        document.getElementById('footerTitle').innerText = `حصرياً ${item.name} على ROMEO LIVE TV`;
        
        pv.style.display = 'flex';
        if(item.link.includes('youtube') || item.link.includes('embed')) {
            container.innerHTML = `<iframe src="${item.link}?autoplay=1" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
        } else {
            container.innerHTML = `<video src="${item.link}" controls autoplay></video>`;
        }
    }

    function closePlayer() {
        document.getElementById('playerView').style.display = 'none';
        document.getElementById('videoContainer').innerHTML = '';
    }

    function toggleSub(id) {
        const menu = document.getElementById(id);
        const isVisible = menu.style.display === 'grid';
        hideAllSubs();
        menu.style.display = isVisible ? 'none' : 'grid';
    }

    function hideAllSubs() { document.querySelectorAll('.sub-menu').forEach(m => m.style.display = 'none'); }

    function filterData(cat, title) {
        document.getElementById('gridTitle').innerText = title;
        render(database.filter(i => i.cat === cat));
        hideAllSubs();
    }

    function handleSearch() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        render(database.filter(i => i.name.toLowerCase().includes(q)));
    }

    function showFavorites() {
        document.getElementById('gridTitle').innerText = "المفضلة ❤️";
        render(database.filter(i => favorites.includes(i.id)));
    }

    loadData();
</script>

</body>
</html>
