<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROMEO LIVE TV</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        /* --- الأساسيات (تم الإبقاء على التصميم كما هو مع إصلاح العرض) --- */
        :root {
            --main-bg: #040714;
            --accent: #e5b80b;
            --accent-glow: rgba(229, 184, 11, 0.5);
            --card-bg: #1a1d29;
            --glass: rgba(15, 20, 35, 0.8);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--main-bg); color: #fff; overflow-x: hidden; font-size: 13px; }

        header {
            padding: 8px 5%; background: rgba(4, 7, 20, 0.95); backdrop-filter: blur(10px);
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid rgba(229, 184, 11, 0.2);
        }
        .logo-text { font-weight: 900; font-size: 1.2rem; color: #fff; }
        .logo-text span { color: var(--accent); }
        
        .download-app-btn {
            background: linear-gradient(45deg, var(--accent), #ffea00);
            color: #000; padding: 5px 12px; border-radius: 15px;
            font-size: 10px; font-weight: 800; text-decoration: none;
        }

        .search-area { padding: 10px 5% 5px; }
        .search-input { 
            width: 100%; background: #1a1d29; border: 1px solid rgba(255,255,255,0.1); 
            padding: 10px 15px; border-radius: 8px; color: #fff; outline: none;
        }

        .hero-menu { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 10px 5%; }
        .main-btn { 
            height: 70px; border-radius: 10px; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; cursor: pointer; 
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05);
            font-size: 11px; font-weight: 700; transition: var(--transition);
        }
        .main-btn i { font-size: 20px; margin-bottom: 4px; }

        .sub-menu { display: none; grid-template-columns: repeat(2, 1fr); gap: 6px; padding: 5px 5%; }
        .sub-item { background: #1a1d29; padding: 10px; border-radius: 6px; text-align: center; font-size: 11px; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); }

        .section-title { padding: 15px 5% 5px; font-size: 16px; font-weight: 800; color: var(--accent); }
        .cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 10px 5% 100px; }
        
        .card { 
            background: var(--card-bg); border-radius: 10px; overflow: hidden; 
            transition: var(--transition); border: 1px solid rgba(255,255,255,0.03);
            cursor: pointer;
        }
        .card img { width: 100%; height: 150px; object-fit: cover; }
        .card-info { padding: 8px 5px; background: rgba(0,0,0,0.85); text-align: center; font-size: 10px; font-weight: 700; }

        /* --- واجهة الحلقات والمشغل --- */
        #episodesView, #playerView {
            position: fixed; inset: 0; background: var(--main-bg); z-index: 2000; display: none;
            flex-direction: column; padding: 20px; overflow-y: auto;
        }
        .ep-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 20px; }
        .ep-item { 
            background: #1a1d29; border: 1px solid var(--accent); padding: 15px; 
            border-radius: 10px; text-align: center; font-weight: 800; cursor: pointer;
        }
        .video-wrapper { width: 100%; max-width: 1000px; margin: auto; }
        iframe { width: 100%; aspect-ratio: 16/9; border: none; border-radius: 15px; }
        .back-nav-btn {
            background: var(--accent); color: #000; padding: 10px 20px; 
            border-radius: 30px; cursor: pointer; font-weight: 800; align-self: flex-start; margin-bottom: 20px;
        }

        .bottom-nav { 
            position: fixed; bottom: 12px; left: 5%; right: 5%; height: 60px;
            background: var(--glass); backdrop-filter: blur(15px);
            display: flex; justify-content: space-around; align-items: center;
            border-radius: 20px; border: 1px solid rgba(229, 184, 11, 0.4); z-index: 1000;
        }
        .nav-item { text-align: center; color: rgba(255,255,255,0.5); cursor: pointer; flex: 1; font-size: 10px; }
        .nav-item i { font-size: 22px; display: block; margin-bottom: 2px; }
        .nav-item.active { color: var(--accent); }
    </style>
</head>
<body>

<header>
    <div class="logo-text">ROMEO <span>LIVE TV</span></div>
    <a href="#" class="download-app-btn">تنزيل التطبيق</a>
</header>

<div class="search-area">
    <input type="text" id="searchInput" class="search-input" placeholder="بحث..." oninput="handleSearch()">
</div>

<div class="hero-menu">
    <div class="main-btn" onclick="toggleSub('m-sub')"><i>🎥</i><span>الأفلام</span></div>
    <div class="main-btn" onclick="toggleSub('s-sub')"><i>📺</i><span>المسلسلات</span></div>
    <div class="main-btn" onclick="filterData('matches', 'المباريات')"><i>⚽</i><span>المباريات</span></div>
    <div class="main-btn" onclick="filterData('music', 'الأغاني')"><i>🎵</i><span>الأغاني</span></div>
</div>

<div id="m-sub" class="sub-menu">
    <div class="sub-item" onclick="filterData('egy1', 'أفلام مصرية 1')">أفلام مصرية 1</div>
    <div class="sub-item" onclick="filterData('egy2', 'أفلام مصرية 2')">أفلام مصرية 2</div>
</div>

<div id="s-sub" class="sub-menu">
    <div class="sub-item" onclick="filterData('ramadan', 'مسلسلات رمضان')">مسلسلات رمضان</div>
    <div class="sub-item" onclick="filterData('arabic', 'مسلسلات عربية')">مسلسلات عربية</div>
</div>

<div class="section-title" id="gridTitle">المعروض الآن</div>
<div class="cards-grid" id="mainGrid"></div>

<!-- واجهة الحلقات -->
<div id="episodesView">
    <div class="back-nav-btn" onclick="closeView('episodesView')">✕ رجوع للموقع</div>
    <h2 id="seriesHeader" style="text-align: center; color: var(--accent); margin-bottom: 20px;"></h2>
    <div class="ep-grid" id="episodesGrid"></div>
</div>

<!-- المشغل -->
<div id="playerView">
    <div class="back-nav-btn" onclick="closeView('playerView')">✕ إغلاق المشغل</div>
    <div class="video-wrapper" id="videoContainer"></div>
</div>

<div class="bottom-nav">
    <div class="nav-item active" onclick="location.reload()"><i>🏠</i><span>الرئيسية</span></div>
    <div class="nav-item" onclick="filterData('fav', 'المفضلة')"><i>❤️</i><span>المفضلة</span></div>
    <div class="nav-item" onclick="window.location.href='https://romeo311020.github.io/ROMEO-MATCH/'"><i>⚽</i><span>المباريات</span></div>
</div>

<script>
    let allItems = []; // لتخزين كافة البيانات

    async function loadData() {
        try {
            const response = await fetch('data.json');
            const data = await response.json();
            // إصلاح الخطأ: استخراج المصفوفة من داخل كائن items
            allItems = data.items || []; 
            render(allItems);
        } catch (e) { 
            document.getElementById('gridTitle').innerText = "خطأ في تحميل البيانات"; 
        }
    }

    function render(data) {
        const grid = document.getElementById('mainGrid');
        grid.innerHTML = '';
        data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<img src="${item.img}"><div class="card-info">${item.name}</div>`;
            card.onclick = () => {
                if(item.type === 'series') openEpisodes(item);
                else openPlayer(item.link);
            };
            grid.appendChild(card);
        });
    }

    function openEpisodes(item) {
        document.getElementById('episodesView').style.display = 'flex';
        document.getElementById('seriesHeader').innerText = item.name;
        const grid = document.getElementById('episodesGrid');
        grid.innerHTML = '';
        
        if(item.episodes && item.episodes.length > 0) {
            item.episodes.forEach(ep => {
                const div = document.createElement('div');
                div.className = 'ep-item';
                div.innerText = ep.name || `الحلقة ${ep.num}`;
                div.onclick = () => openPlayer(ep.link);
                grid.appendChild(div);
            });
        } else {
            grid.innerHTML = '<p style="grid-column: span 2; text-align:center;">لا توجد حلقات مضافة حالياً</p>';
        }
    }

    function openPlayer(link) {
        document.getElementById('playerView').style.display = 'flex';
        document.getElementById('videoContainer').innerHTML = `
            <iframe src="${link}" allowfullscreen sandbox="allow-forms allow-pointer-lock allow-same-origin allow-scripts allow-top-navigation"></iframe>
        `;
    }

    function closeView(id) {
        document.getElementById(id).style.display = 'none';
        if(id === 'playerView') document.getElementById('videoContainer').innerHTML = '';
    }

    function toggleSub(id) {
        const menu = document.getElementById(id);
        const isVisible = menu.style.display === 'grid';
        hideAllSubs();
        menu.style.display = isVisible ? 'none' : 'grid';
    }

    function hideAllSubs() { 
        document.querySelectorAll('.sub-menu').forEach(m => m.style.display = 'none'); 
    }

    function filterData(cat, title) {
        document.getElementById('gridTitle').innerText = title;
        const filtered = allItems.filter(i => i.cat === cat);
        render(filtered);
        hideAllSubs();
    }

    function handleSearch() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        const filtered = allItems.filter(i => i.name.toLowerCase().includes(q));
        render(filtered);
    }

    loadData();
</script>
</body>
</html>
