<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>ROMEO LIVE TV - أفضل موقع للبث المباشر</title>
<meta name="description" content="ROMEO LIVE TV - تابع جميع القنوات المباشرة، الرياضة والمسلسلات بسهولة وسرعة.">
<meta name="keywords" content="ROMEO LIVE TV, بث مباشر, قنوات, مسلسلات, رياضة">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  @keyframes waveGold {
    0% { background-position: 0% 0%; }
    50% { background-position: 100% 0%; }
    100% { background-position: 0% 0%; }
  }

  body {
    margin: 0;
    font-family: Arial, sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    text-align: center;
    padding-top: 100px;
    background: linear-gradient(270deg, #660000, #990000, #cc0000, #660000);
    background-size: 600% 600%;
    animation: gradientMove 20s ease infinite;
    overflow: hidden;
    position: relative;
  }

  /* موجات ذهبية خفيفة */
  body::after {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: repeating-linear-gradient(45deg, rgba(255,215,0,0.05) 0px, rgba(255,215,0,0.05) 2px, transparent 2px, transparent 10px);
    animation: waveGold 10s linear infinite;
    z-index: 0;
  }

  /* شعاع الضوء الأصفر من تحت */
  .light-ray {
    position: absolute;
    bottom: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at bottom center, rgba(255, 255, 0, 0.15), transparent 70%);
    animation: riseLight 6s infinite alternate ease-in-out;
    z-index: 0;
  }

  @keyframes riseLight {
    0% { transform: scale(1) translateY(50px); opacity: 0.3; }
    50% { transform: scale(1.2) translateY(0px); opacity: 0.5; }
    100% { transform: scale(1) translateY(-30px); opacity: 0.3; }
  }

  h1 {
    font-size: 3.8rem;
    margin-bottom: 20px;
    color: white;
    text-shadow: 0 0 15px #fff, 0 0 30px #ffff99, 2px 2px 15px rgba(0,0,0,0.8);
    animation: shine 3s linear infinite;
  }

  @keyframes shine {
    0% { text-shadow: 0 0 10px #fff, 0 0 20px #ffff99; }
    50% { text-shadow: 0 0 20px #fff, 0 0 40px #ffff99; }
    100% { text-shadow: 0 0 10px #fff, 0 0 20px #ffff99; }
  }

  .prompt-box {
    background: rgba(255, 255, 0, 0.08);
    border-radius: 12px;
    padding: 25px 30px;
    margin-bottom: 40px;
    color: #fff;
    font-size: 1.2rem;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    position: relative;
    overflow: hidden;
  }

  .prompt-box::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
    animation: moveLight 6s infinite alternate ease-in-out;
    z-index: 0;
  }

  .prompt-box span { position: relative; z-index: 1; }

  @keyframes moveLight {
    0% { transform: scale(1) translateY(20px); opacity: 0.3; }
    50% { transform: scale(1.2) translateY(0px); opacity: 0.5; }
    100% { transform: scale(1) translateY(-20px); opacity: 0.3; }
  }

  .button-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    position: relative;
    z-index: 1;
  }

  .btn {
    padding: 18px 60px;
    font-size: 1.5rem;
    color: #fff;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    background: linear-gradient(145deg, #cc9900, #996600);
    box-shadow: 0 6px 20px rgba(204,153,0,0.5), 0 0 10px rgba(204,153,0,0.3) inset, 0 0 20px rgba(255,255,0,0.5);
    transition: all 0.4s ease;
    position: relative;
    overflow: hidden;
    animation: btnGlow 2s infinite alternate;
  }

  .btn span { position: relative; z-index: 1; }

  @keyframes btnGlow {
    0% { box-shadow: 0 6px 20px rgba(204,153,0,0.5), 0 0 10px rgba(204,153,0,0.3) inset, 0 0 20px rgba(255,255,0,0.4); }
    50% { box-shadow: 0 6px 25px rgba(204,153,0,0.6), 0 0 15px rgba(204,153,0,0.4) inset, 0 0 30px rgba(255,255,0,0.6); }
    100% { box-shadow: 0 6px 20px rgba(204,153,0,0.5), 0 0 10px rgba(204,153,0,0.3) inset, 0 0 20px rgba(255,255,0,0.5); }
  }

  .btn:hover {
    transform: scale(1.15);
    background: linear-gradient(145deg, #ffff00, #cc9900);
    box-shadow: 0 10px 35px rgba(255,255,0,0.9), 0 0 25px rgba(204,153,0,0.6) inset;
  }

  @media (max-width: 768px) {
    h1 { font-size: 2.5rem; }
    .prompt-box { font-size: 1rem; padding: 15px 20px; margin-bottom: 30px; }
    .btn { font-size: 1.3rem; padding: 15px 40px; }
  }

</style>
</head>
<body>
  <div>
    <h1>ROMEO LIVE TV</h1>

    <div class="prompt-box">
      <span>تابع جميع القنوات المباشرة والمسلسلات والرياضة بسهولة وسرعة على موقع ROMEO LIVE TV.</span>
    </div>

    <div class="button-container">
      <a href="https://romeo-live-online.lovable.app/dashboard" class="btn"><span>دخول</span></a>
      <a href="https://romeo311020.github.io/ROMEO-LIVE-TV.-apk1/" class="btn"><span>تحميل تطبيق</span></a>
    </div>
  </div>

  <!-- شعاع الضوء الأصفر -->
  <div class="light-ray"></div>
</body>
</html>
