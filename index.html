  }

  p {
    font-size: 1.3rem;
    margin-bottom: 50px;

  }

  .btn {
    padding: 20px 60px;
    font-size: 1.6rem;
    color: #fff;
    border: none;
    border-radius: 15px;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    margin: 10px;
    font-weight: bold;
    background: linear-gradient(45deg, #b8860b, #8b6508); /* ذهبي داكن */
    box-shadow: 0 8px 25px rgba(184,134,11,0.6), 0 0 15px rgba(184,134,11,0.4) inset;
    transition: all 0.3s ease;
    animation: glow 2s infinite alternate;
  }

  .btn:hover {
    transform: scale(1.15);
    box-shadow: 0 12px 35px rgba(184,134,11,0.9), 0 0 25px rgba(184,134,11,0.6) inset;
  }

  @keyframes glow {
    0% {
      box-shadow: 0 8px 25px rgba(184,134,11,0.6), 0 0 15px rgba(184,134,11,0.4) inset;
    }
    100% {
      box-shadow: 0 15px 40px rgba(184,134,11,0.9), 0 0 25px rgba(184,134,11,0.7) inset;
    }
  }

  @keyframes moveBg {
    0% {background-position: 0 0;}
    100% {background-position: 100% 100%;}
  }

  body::before {
    content: '';
    position: absolute;
    top:0; left:0; width:100%; height:100%;
    background: url('https://images.unsplash.com/photo-1593642532973-d31b6557fa68?auto=format&fit=crop&w=1350&q=80') no-repeat center center;
    background-size: cover;
