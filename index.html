<style>
/* Reset */
*{margin:0; padding:0; box-sizing:border-box;}

/* Body Background */
body{
  font-family: 'Arial', sans-serif;
  background: linear-gradient(130deg,#0a0f26,#1b243b,#0d1124);
  background-size:400% 400%;
  animation: bgShift 15s ease infinite;
  color:#fff;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  text-align:center;
  overflow:hidden;
}

/* Background animation */
@keyframes bgShift{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

/* Particles */
.particle{
  position:absolute;
  width:4px;
  height:4px;
  background:white;
  border-radius:50%;
  opacity:0.6;
  box-shadow:0 0 6px #00bfff;
  animation: moveParticle linear infinite;
}
@keyframes moveParticle{
  0%{transform: translate(0,0);}
  100%{transform: translate(50px, -100vh);}
}

/* Main container */
.container{
  width:100%;
  max-width:380px;
  background:rgba(0,0,0,0.45);
  padding:25px 18px;
  border-radius:15px;
  box-shadow:0 0 25px rgba(0,0,0,0.6);
  backdrop-filter:blur(7px);
  position:relative;
  z-index:1;
}

/* Logo */
.logo{
  width:110px;
  height:110px;
  margin:0 auto 15px auto;
  background:radial-gradient(circle,#ffcc00,#b38f00);
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:32px;
  font-weight:bold;
  color:#0a0f26;
  text-shadow:0 0 8px rgba(0,0,0,0.6);
  animation: logoGlow 2s infinite alternate;
}
@keyframes logoGlow{
  0%{box-shadow:0 0 10px #ffcc00;}
  50%{box-shadow:0 0 20px #ffcc00;}
  100%{box-shadow:0 0 10px #ffcc00;}
}

/* Main Title */
h1{
  font-size:30px;
  margin-bottom:12px;
  font-weight:bold;
  color:#ffcf41;
  text-shadow:0 0 8px rgba(255,207,65,0.7);
}

/* Description */
.desc{
  font-size:17px;
  line-height:1.5;
  margin-bottom:20px;
  color:#e0e0e0;
}

/* Buttons */
.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:14px;
  margin-top:12px;
  font-size:19px;
  font-weight:bold;
  text-decoration:none;
  width:100%;
  border-radius:8px;
  transition:0.3s;
  color:#fff;
  box-shadow:0 0 12px rgba(0,0,0,0.5);
}
.btn img{
  width:22px;
  margin-left:8px;
}

/* Button colors */
.btn-login{
  background:linear-gradient(90deg,#4e6ef2,#2c3ce6);
}
.btn-music{
  background:linear-gradient(90deg,#b45dee,#7b31d4);
}
.btn-download{
  background:linear-gradient(90deg,#26b5ff,#0c80c9);
}

/* Hover effects */
.btn:hover{
  transform:scale(1.05);
  box-shadow:0 0 18px rgba(0,0,0,0.7);
}

/* Footer small */
.footer{
  font-size:13px;
  margin-top:18px;
  color:#ccc;
}

/* WhatsApp button */
.whatsapp{
  position:fixed;
  bottom:25px;
  right:25px;
  width:60px;
  height:60px;
  background:#25D366;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  box-shadow:0 0 20px rgba(0,0,0,0.5);
  z-index:2;
}
.whatsapp img{ width:32px; }

/* Responsive */
@media(max-width:420px){
  h1{font-size:26px;}
  .btn{font-size:17px;}
}
</style>
</head>

<script>
// Create moving particles
const particleContainer = document.getElementById('particles');
const numParticles = 50;
for(let i=0;i<numParticles;i++){
  const p = document.createElement('div');
  p.classList.add('particle');
  p.style.top = Math.random()*window.innerHeight + 'px';
  p.style.left = Math.random()*window.innerWidth + 'px';
  const size = 2 + Math.random()*3;
  p.style.width = size+'px';
  p.style.height = size+'px';
  p.style.opacity = 0.3 + Math.random()*0.7;
  const duration = 8 + Math.random()*12;
  p.style.animationDuration = duration+'s';
  p.style.animationIterationCount = 'infinite';
  particleContainer.appendChild(p);
}
</script>
