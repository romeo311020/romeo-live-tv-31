<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROMEO LIVE TV | بث مباشر للمباريات والنتائج لحظة بلحظة</title>
    <meta name="description" content="شاهد البث المباشر لأهم مباريات اليوم، نتائج مباشرة، وتشكيلات الفرق على ROMEO LIVE TV. خدمة سريعة ومجانية بدون إعلانات مزعجة.">
    <meta name="keywords" content="بث مباشر، مباريات اليوم، كورة لايف، يلا شوت، روميو لايف">
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #040714;
            --card: #121826;
            --accent-red: #ff3e3e;
            --accent-gold: #e5b80b;
            --text-gray: #8e94a5;
            --glow: 0 0 15px rgba(255, 62, 62, 0.3);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: white; line-height: 1.4; overflow-x: hidden; scroll-behavior: smooth; }

        /* --- الأنميشن --- */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .page { display: none; animation: fadeIn 0.4s ease forwards; padding-bottom: 80px; }
        .page.active { display: block; }

        /* --- الهيدر العام --- */
        header { background: var(--card); padding: 10px; text-align: center; border-bottom: 1px solid rgba(229, 184, 11, 0.2); position: sticky; top: 0; z-index: 1000; }
        .logo-main { font-size: 20px; font-weight: 900; color: white; text-shadow: var(--glow); letter-spacing: 1px; cursor: pointer; }
        .logo-main span { color: var(--accent-red); }
        .logo-sub { font-size: 11px; color: var(--text-gray); display: block; margin-top: -3px; font-weight: 600; }

        /* --- أزرار التاريخ --- */
        .date-nav { display: flex; justify-content: center; gap: 8px; padding: 15px 10px; background: var(--bg); }
        .date-btn { 
            background: var(--card); border: 1px solid rgba(255,255,255,0.05); color: var(--text-gray); 
            padding: 6px 15px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 700; transition: var(--transition);
        }
        .date-btn.active { background: var(--accent-red); color: white; border-color: var(--accent-red); box-shadow: var(--glow); }

        /* --- كروت المباريات --- */
        .matches-list { padding: 0 10px; display: flex; flex-direction: column; gap: 10px; max-width: 600px; margin: 0 auto; }
        .match-card {
            background: var(--card); border-radius: 12px; padding: 12px; display: flex; align-items: center;
            text-decoration: none; color: white; border: 1px solid rgba(255,255,255,0.03); transition: var(--transition);
            cursor: pointer;
        }
        .match-card:hover { transform: translateY(-3px); border-color: var(--accent-gold); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        
        .team-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .team-col img { width: 35px; height: 35px; object-fit: contain; loading: lazy; } /* تحسين الصور */
        .team-name-small { font-size: 11px; font-weight: 700; text-align: center; }

        .match-mid { flex: 0.8; text-align: center; }
        .vs-small { font-size: 14px; font-weight: 900; color: var(--accent-gold); display: block; }
        .status-tag { font-size: 9px; padding: 2px 8px; border-radius: 4px; background: rgba(255,255,255,0.05); font-weight: bold; }
        .status-live { color: #ff3e3e; border: 1px solid #ff3e3e; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% {opacity: 1} 50% {opacity: 0.5} 100% {opacity: 1} }

        /* --- تفاصيل المباراة --- */
        .match-details-header { background: linear-gradient(180deg, var(--card) 0%, var(--bg) 100%); padding: 25px 15px; text-align: center; position: relative; }
        .details-teams { display: flex; align-items: center; justify-content: center; gap: 20px; }
        .details-team img { width: 65px; height: 65px; margin-bottom: 10px; loading: lazy; }
        .details-vs { font-size: 24px; font-weight: 900; color: var(--accent-gold); }

        .action-tabs { display: flex; gap: 10px; padding: 0 15px; max-width: 500px; margin: 0 auto 20px; }
        .tab-btn { 
            flex: 1; padding: 10px; border-radius: 10px; border: none; background: var(--card); color: white;
            font-weight: 700; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px;
            transition: var(--transition);
        }
        .tab-btn.active { background: var(--accent-red); box-shadow: var(--glow); }

        .video-container { padding: 0 15px; max-width: 900px; margin: 0 auto; display: none; }
        .video-container.active { display: block; }
        .player-box { 
            position: relative; padding-top: 56.25%; background: #000; border-radius: 15px; overflow: hidden;
            border: 1px solid var(--accent-gold); box-shadow: 0 0 20px rgba(229, 184, 11, 0.1);
        }
        .player-box iframe { position: absolute; top:0; left:0; width:100%; height:100%; border:0; }

        .lineup-container { padding: 0 15px; max-width: 600px; margin: 0 auto; display: none; text-align: center; }
        .lineup-container.active { display: block; }
        .lineup-selector { display: flex; gap: 5px; justify-content: center; margin-bottom: 15px; }
        .l-btn { padding: 5px 12px; font-size: 12px; border-radius: 5px; border: 1px solid var(--text-gray); background: none; color: white; cursor: pointer; transition: 0.3s; }
        .l-btn.active { background: var(--accent-gold); color: black; border-color: var(--accent-gold); }
        .lineup-img { width: 100%; border-radius: 10px; display: none; margin-top: 10px; loading: lazy; }
        .lineup-img.active { display: block; }

        .back-btn { position: absolute; right: 15px; top: 15px; color: white; font-size: 20px; cursor: pointer; z-index: 10; }

        /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
        /* 🚀 إضافات التحسين الاحترافية (CSS NEW) 🚀 */
        /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */

        /* قسم مباريات الآن */
        .live-now-section { padding: 10px; margin-bottom: 5px; display: none; }
        .live-now-section.has-matches { display: block; }
        .live-title { font-size: 14px; color: var(--accent-red); font-weight: 800; margin-bottom: 10px; display: flex; align-items: center; gap: 5px; padding-right: 10px; }
        .live-card { background: linear-gradient(45deg, #1a2133, #0d111a); border: 1.5px solid var(--accent-red); margin-bottom: 10px; box-shadow: 0 0 10px rgba(255, 62, 62, 0.1); }

        /* Skeleton Loader */
        .skeleton { background: #1a2133; position: relative; overflow: hidden; height: 80px; border-radius: 12px; margin-bottom: 10px; }
        .skeleton::after { content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent); animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 100% { transform: translateX(100%); } }

        /* Error Handling UI */
        .error-box { text-align: center; padding: 40px 20px; display: none; }
        .retry-btn { background: var(--accent-gold); color: black; border: none; padding: 8px 20px; border-radius: 8px; font-weight: bold; margin-top: 15px; cursor: pointer; }

        /* سيرفرات البث */
        .server-nav { display: flex; justify-content: center; gap: 8px; margin-top: 15px; flex-wrap: wrap; }
        .srv-btn { background: #1a2133; color: white; border: 1px solid #333; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; transition: 0.3s; }
        .srv-btn.active { background: var(--accent-gold); color: black; border-color: var(--accent-gold); }

        /* Countdown */
        .countdown { font-size: 10px; color: var(--accent-gold); margin-top: 4px; font-weight: bold; }

        /* التذييل الثابت */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-around; padding: 10px; z-index: 1000; }
        .nav-item { color: var(--text-gray); text-decoration: none; font-size: 10px; text-align: center; }
        .nav-item.active { color: var(--accent-gold); }
        .nav-item i { font-size: 18px; display: block; margin-bottom: 2px; }

    </style>

    <style>
        /* تحسين الثيم العام */
        :root {
            --premium-bg: #0b0f1a;
            --premium-card: linear-gradient(145deg, #1e293b, #0f172a);
            --premium-glow: 0 0 20px rgba(30, 41, 59, 0.5);
            --cinema-transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
        }

        body { background-color: var(--premium-bg) !important; }

        /* تحسين كروت المباريات */
        .match-card {
            background: var(--premium-card) !important;
            border: 1px solid rgba(255,255,255,0.05) !important;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.2);
        }
        .match-card:hover {
            transform: scale(1.03) translateY(-5px) !important;
            border-color: var(--accent-red) !important;
            box-shadow: 0 10px 25px rgba(255, 62, 62, 0.2) !important;
        }

        /* شاشة التحميل الاحترافية */
        #premiumLoader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); z-index: 9999; display: none;
            align-items: center; justify-content: center; flex-direction: column;
            backdrop-filter: blur(10px);
        }
        .loader-content { text-align: center; }
        .premium-spinner {
            width: 50px; height: 50px; border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid var(--accent-red); border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        .progress-bar-container { width: 200px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; }
        .progress-fill { width: 0%; height: 100%; background: var(--accent-red); transition: width 0.3s; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* وضع السينما Cinema Mode */
        .cinema-active { overflow: hidden; }
        .cinema-active header, .cinema-active .match-details-header, .cinema-active .action-tabs, .cinema-active .bottom-nav, .cinema-active .server-nav {
            display: none !important;
        }
        .cinema-active #streamSection {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 10000; background: #000; padding: 0 !important; max-width: 100% !important;
        }
        .cinema-active .player-box { height: 100vh !important; padding-top: 0 !important; border: none !important; border-radius: 0 !important; }
        
        .cinema-btn {
            background: rgba(255,255,255,0.1); color: white; border: none; padding: 8px 15px;
            border-radius: 20px; font-size: 12px; margin-top: 10px; cursor: pointer;
            display: flex; align-items: center; gap: 5px; transition: 0.3s;
        }
        .cinema-btn:hover { background: var(--accent-gold); color: #000; }
        .exit-cinema {
            position: fixed; top: 20px; left: 20px; z-index: 10001;
            background: rgba(255, 62, 62, 0.8); color: white; border: none;
            padding: 10px; border-radius: 50%; cursor: pointer; display: none;
        }

        /* تحسين أزرار السيرفرات */
        .srv-btn {
            border-radius: 25px !important; padding: 8px 18px !important;
            text-transform: uppercase; letter-spacing: 1px; font-weight: bold !important;
        }
        .srv-btn:active { transform: scale(0.9); }

        /* تحسين المشغل */
        .player-box {
            box-shadow: 0 15px 50px rgba(0,0,0,0.6) !important;
            transition: var(--cinema-transition);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-main" onclick="showHome()">ROMEO <span>LIVE TV</span></div>
        <span class="logo-sub">𝑴𝒂𝒕𝒄𝒉</span>
    </header>

    <div id="homePage" class="page active">
        <div id="liveNowSection" class="live-now-section">
            <div class="live-title"><i class="fas fa-circle" style="font-size: 8px; animation: pulse 1s infinite;"></i> مباريات الآن</div>
            <div id="liveContainer" class="matches-list"></div>
        </div>

        <div class="date-nav">
            <button class="date-btn" onclick="filterMatches('yesterday', this)">الأمس</button>
            <button class="date-btn active" onclick="filterMatches('today', this)">اليوم</button>
            <button class="date-btn" onclick="filterMatches('tomorrow', this)">الغد</button>
        </div>

        <div id="loader" class="matches-list">
            <div class="skeleton"></div>
            <div class="skeleton"></div>
            <div class="skeleton"></div>
        </div>

        <div id="errorBox" class="error-box">
            <i class="fas fa-exclamation-triangle" style="font-size: 40px; color: var(--accent-red);"></i>
            <p style="margin-top: 10px;">فشل تحميل المباريات، تأكد من اتصالك</p>
            <button class="retry-btn" onclick="loadData()">إعادة المحاولة</button>
        </div>

        <div class="matches-list" id="matchesContainer"></div>
    </div>

    <div id="matchPage" class="page">
        <div class="match-details-header" id="detailsHeader"></div>

        <div class="action-tabs">
            <button class="tab-btn active" onclick="toggleMatchSection('stream', this)">
                <i class="fas fa-play"></i> البث المباشر
            </button>
            <button class="tab-btn" onclick="toggleMatchSection('lineup', this)">
                <i class="fas fa-users"></i> التشكيلة
            </button>
        </div>

        <div id="streamSection" class="video-container active">
            <div class="player-box" id="playerBox"></div>
            <div style="display: flex; justify-content: center;">
                <button class="cinema-btn" onclick="enableCinemaMode()"><i class="fas fa-expand"></i> وضع السينما (تكبير)</button>
            </div>
            <div id="serverNav" class="server-nav"></div>
        </div>

        <div id="lineupSection" class="lineup-container">
            <div class="lineup-selector" id="lineupSelector"></div>
            <div id="lineupImages"></div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="#" class="nav-item active" onclick="showHome()"><i class="fas fa-home"></i><span>الرئيسية</span></a>
        <a href="#" class="nav-item" onclick="filterMatches('today', document.querySelector('.date-btn.active'))"><i class="fas fa-calendar-day"></i><span>المباريات</span></a>
        <a href="https://wa.me/201027675035" class="nav-item"><i class="fab fa-whatsapp"></i><span>واتساب</span></a>
    </nav>

    <div id="premiumLoader">
        <div class="loader-content">
            <div class="premium-spinner"></div>
            <div class="progress-bar-container">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <p style="margin-top: 15px; font-weight: bold; font-size: 14px;">جاري تجهيز البث المباشر...</p>
        </div>
    </div>
    <button class="exit-cinema" id="exitCinemaBtn" onclick="disableCinemaMode()"><i class="fas fa-compress"></i></button>

    <script>
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 📌 الكود الأصلي المعدل بإضافات (JS)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        
        let db = { yesterday: [], today: [], tomorrow: [] };
        let currentDay = 'today';
        let countdownInterval;

        // دالة تحميل البيانات مع Error Handling و Loading
        async function loadData() {
            const loader = document.getElementById('loader');
            const container = document.getElementById('matchesContainer');
            const errorBox = document.getElementById('errorBox');
            
            loader.style.display = 'flex';
            container.innerHTML = '';
            errorBox.style.display = 'none';

            try {
                const response = await fetch('matches.json?v=' + Date.now());
                if (!response.ok) throw new Error();
                const data = await response.json();
                
                db.yesterday = data.yesterday || [];
                db.today = data.today || [];
                db.tomorrow = data.tomorrow || [];

                loader.style.display = 'none';
                renderMatches(currentDay);
                renderLiveNow(); // تحديث قسم "مباشر الآن"
                startGlobalCountdowns();
            } catch (err) {
                loader.style.display = 'none';
                errorBox.style.display = 'block';
            }
        }

        function renderMatches(day) {
            const container = document.getElementById('matchesContainer');
            container.innerHTML = '';
            
            if (db[day].length === 0 && day === 'today') {
                container.innerHTML = '<div style="text-align:center; padding:20px; color:gray;">لا توجد مباريات مجدولة</div>';
                return;
            }

            db[day].forEach(m => {
                const card = createMatchCard(m);
                container.appendChild(card);
            });
        }

        // إنشاء كرت مباراة (موحد لكل الأقسام)
        function createMatchCard(m, isLiveSection = false) {
            const statusHtml = m.status === 'live' ? 
                '<span class="status-tag status-live">🔴 مباشر</span>' : 
                (m.status === 'finished' ? '<span class="status-tag">✅ انتهت</span>' : '<span class="status-tag">⏳ لم تبدأ</span>');
            
            const card = document.createElement('div');
            card.className = `match-card ${isLiveSection ? 'live-card' : ''}`;
            card.onclick = () => {
                // Debounce بسيط لمنع الضغط المتكرر
                if(card.getAttribute('data-loading')) return;
                card.setAttribute('data-loading', 'true');
                openMatch(m);
                setTimeout(() => card.removeAttribute('data-loading'), 500);
            };

            // حساب وقت البداية للـ Countdown
            let countdownHtml = '';
            if(m.status === 'not_started' && m.time) {
                countdownHtml = `<div class="countdown" data-time="${m.time}">${m.time}</div>`;
            }

            card.innerHTML = `
                <div class="team-col">
                    <img src="${m.team1.logo || 'https://via.placeholder.com/35'}" loading="lazy">
                    <span class="team-name-small">${m.team1.name}</span>
                </div>
                <div class="match-mid">
                    ${statusHtml}
                    <span class="vs-small">${m.result || m.time || 'VS'}</span>
                    ${countdownHtml}
                </div>
                <div class="team-col">
                    <img src="${m.team2.logo || 'https://via.placeholder.com/35'}" loading="lazy">
                    <span class="team-name-small">${m.team2.name}</span>
                </div>
            `;
            return card;
        }

        // قسم مباريات الآن (جديد)
        function renderLiveNow() {
            const liveContainer = document.getElementById('liveContainer');
            const liveSection = document.getElementById('liveNowSection');
            const liveMatches = db.today.filter(m => m.status === 'live');
            
            liveContainer.innerHTML = '';
            if (liveMatches.length > 0) {
                liveSection.classList.add('has-matches');
                liveMatches.forEach(m => {
                    liveContainer.appendChild(createMatchCard(m, true));
                });
            } else {
                liveSection.classList.remove('has-matches');
            }
        }

        // العداد التنازلي (جديد)
        function startGlobalCountdowns() {
            if(countdownInterval) clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                document.querySelectorAll('.countdown').forEach(el => {
                    const matchTime = el.getAttribute('data-time');
                    const now = new Date();
                    const [hours, minutes] = matchTime.split(':');
                    const target = new Date();
                    target.setHours(hours, minutes, 0);

                    const diff = target - now;
                    if (diff > 0) {
                        const h = Math.floor(diff / 3600000);
                        const m = Math.floor((diff % 3600000) / 60000);
                        const s = Math.floor((diff % 60000) / 1000);
                        el.innerText = `${h}:${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
                    } else {
                        el.innerText = "بدأت قريباً";
                    }
                });
            }, 1000);
        }

        function filterMatches(day, btn) {
            currentDay = day;
            document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderMatches(day);
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 🚀 المشغل الذكي الجديد (Smart Multi-Link Player) 🚀
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        function openMatch(match) {
            // --- إضافة تأثير التحميل الجديد قبل الفتح ---
            const pLoader = document.getElementById('premiumLoader');
            const pFill = document.getElementById('progressFill');
            pLoader.style.display = 'flex';
            pFill.style.width = '0%';
            
            setTimeout(() => pFill.style.width = '70%', 200);

            setTimeout(() => {
                pFill.style.width = '100%';
                setTimeout(() => {
                    pLoader.style.display = 'none';
                    executeOpenMatch(match); // الدالة الأصلية في الأسفل
                }, 400);
            }, 1200);
        }

        // نقل منطق الفتح الأصلي لدالة فرعية للحفاظ عليه
        function executeOpenMatch(match) {
            document.getElementById('homePage').classList.remove('active');
            document.getElementById('matchPage').classList.add('active');
            window.scrollTo(0,0);
            
            document.title = `بث مباشر: ${match.team1.name} vs ${match.team2.name}`;

            const header = document.getElementById('detailsHeader');
            header.innerHTML = `
                <i class="fas fa-arrow-right back-btn" onclick="showHome()"></i>
                <div class="details-teams">
                    <div class="details-team"><img src="${match.team1.logo}"><div>${match.team1.name}</div></div>
                    <div class="details-vs">${match.result || 'VS'}</div>
                    <div class="details-team"><img src="${match.team2.logo}"><div>${match.team2.name}</div></div>
                </div>
            `;

            const srvNav = document.getElementById('serverNav');
            srvNav.innerHTML = '';
            
            // جلب الروابط من لوحة التحكم (stream, stream2, stream3 أو link, link2)
            const servers = [
                { name: 'سيرفر 1', url: match.stream || match.link },
                { name: 'سيرفر 2', url: match.stream2 || match.link2 }
            ].filter(s => s.url);

            servers.forEach((s, idx) => {
                const btn = document.createElement('button');
                btn.className = `srv-btn ${idx === 0 ? 'active' : ''}`;
                btn.innerText = s.name;
                btn.onclick = () => loadSmartPlayer(s.url, btn);
                srvNav.appendChild(btn);
            });

            if(servers.length > 0) loadSmartPlayer(servers[0].url);
            else document.getElementById('playerBox').innerHTML = '<div style="padding:40px; text-align:center;">البث غير متوفر حالياً</div>';

            document.getElementById('lineupSelector').innerHTML = `
                <button class="l-btn active" onclick="changeLineupImg(1, this)">${match.team1.name}</button>
                <button class="l-btn" onclick="changeLineupImg(2, this)">${match.team2.name}</button>
            `;
            document.getElementById('lineupImages').innerHTML = `
                <img src="${match.team1.lineup || 'https://via.placeholder.com/400x600?text=Lineup+Unavailable'}" id="img-l-1" class="lineup-img active">
                <img src="${match.team2.lineup || 'https://via.placeholder.com/400x600?text=Lineup+Unavailable'}" id="img-l-2" class="lineup-img">
            `;
        }

        // نظام التشغيل الذكي: يحدد نوع الرابط ويشغله بالتقنية المناسبة
        function loadSmartPlayer(url, btn = null) {
            if(btn) {
                document.querySelectorAll('.srv-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }
            
            const box = document.getElementById('playerBox');
            box.innerHTML = ''; // تنظيف المشغل

            // 1. فحص روابط الفيديو المباشرة (m3u8 أو mp4)
            if (url.includes('.m3u8') || url.includes('.mp4')) {
                const video = document.createElement('video');
                video.controls = true;
                video.autoplay = true;
                video.style.width = '100%';
                video.style.height = '100%';
                video.style.position = 'absolute';
                video.style.top = '0';
                video.style.left = '0';
                
                if (url.includes('.m3u8')) {
                    // دعم HLS عبر مكتبة hls.js إذا كانت متوفرة أو عبر المشغل الافتراضي
                    if (typeof Hls !== 'undefined' && Hls.isSupported()) {
                        const hls = new Hls();
                        hls.loadSource(url);
                        hls.attachMedia(video);
                    } else {
                        video.src = url;
                    }
                } else {
                    video.src = url;
                }
                box.appendChild(video);
            } 
            // 2. فحص روابط اليوتيوب أو iframe أو الصفحات الخارجية
            else {
                const iframe = document.createElement('iframe');
                iframe.allowFullscreen = true;
                iframe.allow = "autoplay; encrypted-media";
                
                // إذا كان الرابط يوتيوب عادي وليس embed، نقوم بتحويله
                if (url.includes('youtube.com/watch?v=')) {
                    const vidId = url.split('v=')[1].split('&')[0];
                    url = `https://www.youtube.com/embed/${vidId}`;
                } else if (url.includes('youtu.be/')) {
                    const vidId = url.split('youtu.be/')[1];
                    url = `https://www.youtube.com/embed/${vidId}`;
                }
                
                iframe.src = url;
                box.appendChild(iframe);
            }
        }

        function showHome() {
            document.getElementById('matchPage').classList.remove('active');
            document.getElementById('homePage').classList.add('active');
            document.getElementById('playerBox').innerHTML = '';
            document.title = "ROMEO LIVE TV | المركز الرياضي";
            disableCinemaMode(); // التأكد من إغلاق وضع السينما
        }

        function toggleMatchSection(sec, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('streamSection').classList.remove('active');
            document.getElementById('lineupSection').classList.remove('active');
            document.getElementById(sec + 'Section').classList.add('active');
        }

        function changeLineupImg(num, btn) {
            document.querySelectorAll('.l-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.lineup-img').forEach(i => i.classList.remove('active'));
            document.getElementById('img-l-' + num).classList.add('active');
        }

        window.onload = loadData;

    </script>

    <script id="new-logic-add-only">
        // وظيفة دمج كافة المباريات في قائمة واحدة
        function renderAllMatchesSimple() {
            const container = document.getElementById('matchesContainer');
            if(!container) return;

            // ننتظر حتى تكتمل البيانات في db أولاً
            if (!db.today.length && !db.yesterday.length && !db.tomorrow.length) {
                setTimeout(renderAllMatchesSimple, 500);
                return;
            }

            container.innerHTML = '';
            
            // إضافة العنوان الرئيسي الجديد أعلى القائمة
            if(!document.getElementById('addedTitle')) {
                const title = document.createElement('h2');
                title.id = 'addedTitle';
                title.className = 'custom-main-title';
                title.innerText = 'شاهد المباريات بث مباشر';
                container.parentNode.insertBefore(title, container);
            }

            // دمج كل المصفوفات (yesterday, today, tomorrow) في قائمة واحدة
            const allMatches = [...db.yesterday, ...db.today, ...db.tomorrow];

            if (allMatches.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:20px; color:gray;">لا توجد مباريات متاحة حالياً</div>';
                return;
            }

            // عرض المباريات المدمجة بالكامل
            allMatches.forEach(m => {
                const card = createMatchCard(m);
                container.appendChild(card);
            });
        }

        // ربط الوظيفة الجديدة بنهاية عملية تحميل البيانات الأصلية دون تغييرها
        const originalLoadData = loadData;
        loadData = async function() {
            await originalLoadData();
            renderAllMatchesSimple();
        };

        // التأكد من التشغيل عند تحميل الصفحة
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(renderAllMatchesSimple, 1000);
        });
    </script>

    <script id="premium-player-logic">
        // وظيفة تحديث شاشة التحميل (Loader)
        function updatePremiumLoaderUI() {
            const loader = document.getElementById('premiumLoader');
            if(!loader) return;

            // استبدال المحتوى القديم بالتصميم الجديد
            loader.innerHTML = `
                <div class="loader-layout">
                    <div class="loader-text-group">
                        <div class="loader-title">ROMEO LIVE HD</div>
                        <div class="loader-bar-bg">
                            <div class="loader-bar-fill" id="newProgressFill"></div>
                        </div>
                        <p style="margin-top: 10px; font-size: 12px; color: var(--text-gray);">جاري الاتصال بالسيرفر المشفر...</p>
                    </div>
                    <div class="side-spinner"></div>
                </div>
            `;
        }

        // إضافة العلامة المائية للمشغل
        function addPlayerWatermark() {
            const playerBox = document.getElementById('playerBox');
            if(!playerBox || document.getElementById('romeoWatermark')) return;

            const watermark = document.createElement('div');
            watermark.id = 'romeoWatermark';
            watermark.className = 'player-watermark';
            watermark.innerHTML = `
                <i class="fas fa-compact-disc fa-spin" style="color: var(--accent-gold);"></i>
                <span>ROMEO LIVE HD</span>
            `;
            playerBox.appendChild(watermark);
        }

        // دالة تشغيل التحميل الجديد
        const originalOpenMatch = openMatch;
        openMatch = function(match) {
            updatePremiumLoaderUI();
            const pLoader = document.getElementById('premiumLoader');
            const pFill = document.getElementById('newProgressFill');
            
            pLoader.style.display = 'flex';
            setTimeout(() => { if(pFill) pFill.style.width = '85%'; }, 100);

            setTimeout(() => {
                if(pFill) pFill.style.width = '100%';
                setTimeout(() => {
                    pLoader.style.display = 'none';
                    executeOpenMatch(match);
                    addPlayerWatermark(); // إضافة العلامة المائية عند فتح المشغل
                }, 500);
            }, 1500);
        };

        // تشغيل التعديلات عند التحميل
        window.addEventListener('load', () => {
            updatePremiumLoaderUI();
        });
    </script>
