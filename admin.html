<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROMEO ADMIN PANEL</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #e5b80b; --bg: #0a0f1e; --card: #161d2f; --text: #ffffff; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Cairo', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; }
        .admin-box { width: 100%; max-width: 500px; background: var(--card); padding: 30px; border-radius: 20px; border: 1px solid var(--primary); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: var(--primary); margin-bottom: 25px; }
        .group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #aaa; }
        input, select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #333; background: #0d1224; color: #fff; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; background: var(--primary); border: none; border-radius: 10px; color: #000; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
        #status { margin-top: 15px; padding: 10px; border-radius: 8px; text-align: center; display: none; }
    </style>
</head>
<body>

<div class="admin-box">
    <h2>لوحة تحكم روميو لايف</h2>
    
    <div class="group">
        <label>GitHub Token</label>
        <input type="password" id="token" placeholder="ghp_...">
    </div>
    
    <div class="group">
        <label>اسم المستودع (User/Repo)</label>
        <input type="text" id="repo" value="romeo311020/romeo-live-tv-31">
    </div>

    <hr style="border: 0.5px solid #333; margin: 20px 0;">

    <div class="group">
        <label>اسم الفيلم / المسلسل</label>
        <input type="text" id="name">
    </div>
    <div class="group">
        <label>رابط الصورة</label>
        <input type="text" id="img">
    </div>
    <div class="group">
        <label>رابط المشاهدة</label>
        <input type="text" id="link">
    </div>
    <div class="group">
        <label>القسم</label>
        <select id="cat">
            <option value="egy1">أفلام مصرية 1</option>
            <option value="egy2">أفلام مصرية 2</option>
            <option value="ramadan">رمضان 2026</option>
        </select>
    </div>

    <button class="btn" onclick="uploadData()">نشر الآن 🚀</button>
    <div id="status"></div>
</div>

<script>
    async function uploadData() {
        const token = document.getElementById('token').value;
        const repo = document.getElementById('repo').value;
        const name = document.getElementById('name').value;
        const img = document.getElementById('img').value;
        const link = document.getElementById('link').value;
        const cat = document.getElementById('cat').value;
        const status = document.getElementById('status');

        if(!token || !name) { alert("امسح التوكن وادخله مرة ثانية!"); return; }

        status.style.display = "block";
        status.innerText = "جاري الرفع...";
        status.style.backgroundColor = "#444";

        const url = `https://api.github.com/contents/data.json`;

        try {
            const res = await fetch(url, { headers: { "Authorization": `token ${token}` } });
            const file = await res.json();
            
            // فك التشفير مع دعم اللغة العربية
            let content = JSON.parse(decodeURIComponent(escape(atob(file.content))));
            
            content.push({ id: Date.now(), name, img, link, cat });

            const updated = await fetch(url, {
                method: "PUT",
                headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    message: "Add: " + name,
                    content: btoa(unescape(encodeURIComponent(JSON.stringify(content, null, 2)))),
                    sha: file.sha
                })
            });

            if(updated.ok) {
                status.innerText = "✅ تم النشر بنجاح!";
                status.style.backgroundColor = "#1b4332";
            } else {
                throw new Error();
            }
        } catch(e) {
            status.innerText = "❌ فشل الرفع! تأكد من التوكن والإنترنت.";
            status.style.backgroundColor = "#780000";
        }
    }
</script>

</body>
</html>
