<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROMEO TV Pro | الإصدار المستقر</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #e5b80b; --bg: #050811; --card: #111827; --danger: #ff4757; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: var(--bg); color: #fff; line-height: 1.6; }

        /* الشاشات */
        .screen { display: none; padding: 20px; animation: fadeIn 0.3s; }
        .active-screen { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* الهيدر */
        header { background: var(--card); padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold); position: sticky; top: 0; z-index: 100; }
        .back-btn { background: #1e293b; padding: 5px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; }

        /* الأزرار الكبيرة */
        .grid { display: grid; grid-template-columns: 1fr; gap: 15px; margin-top: 15px; }
        .box { background: var(--card); padding: 25px; border-radius: 18px; display: flex; align-items: center; gap: 15px; border: 1px solid #1e293b; cursor: pointer; }
        .box i { font-size: 30px; }
        .box b { font-size: 18px; }

        /* قائمة العناصر */
        .item { background: var(--card); padding: 10px; border-radius: 12px; display: flex; gap: 15px; margin-bottom: 10px; border: 1px solid #1e293b; align-items: center; }
        .item img { width: 50px; height: 70px; border-radius: 8px; object-fit: cover; }
        .item-info { flex: 1; }
        .actions { display: flex; gap: 8px; }
        .btn-sm { padding: 6px 12px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; font-size: 12px; }

        /* الفورم */
        input, select { width: 100%; padding: 15px; margin-bottom: 15px; background: #1f2937; border: 1px solid #374151; border-radius: 10px; color: #fff; }
        .save-btn { background: var(--gold); color: #000; width: 100%; padding: 15px; border-radius: 10px; border: none; font-weight: 900; font-size: 18px; cursor: pointer; }

        #loader { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div id="loader"><div style="border:3px solid #f3f3f3; border-top:3px solid var(--gold); width:40px; height:40px; border-radius:50%; animation:spin 1s linear infinite;"></div><p style="margin-top:15px">جاري المزامنة...</p></div>

<!-- دخول -->
<div id="screen-login" class="screen active-screen">
    <div style="text-align:center; margin-top:100px;">
        <h1 style="color:var(--gold); font-weight:900;">ROMEO TV</h1>
        <p style="margin-bottom:30px; opacity:0.7;">لوحة التحكم الاحترافية</p>
        <input type="password" id="token" placeholder="GitHub Token">
        <input type="text" id="repo" placeholder="المستودع (user/repo)">
        <button class="save-btn" onclick="login()">دخول 🔓</button>
    </div>
</div>

<header id="nav" style="display:none">
    <div class="back-btn" id="backBtn" onclick="goBack()">⬅ رجوع</div>
    <div style="font-weight:900;">لوحة التحكم</div>
</header>

<!-- الرئيسية -->
<div id="screen-home" class="screen">
    <h2>أهلاً بك يا روميو 👋</h2>
    <div class="grid">
        <div class="box" onclick="openMainCat('movies')"><i>🎬</i> <b>الأفلام</b></div>
        <div class="box" onclick="openMainCat('series')"><i>📺</i> <b>المسلسلات</b></div>
        <div class="box" onclick="openMainCat('matches')"><i>⚽</i> <b>المباريات</b></div>
    </div>
</div>

<!-- الأقسام الفرعية -->
<div id="screen-subs" class="screen">
    <h2 id="sub-title" style="color:var(--gold)"></h2>
    <div class="grid" id="subs-list"></div>
    <!-- زر الإضافة سيتحكم فيه الجافاسكريبت ليختفي في المباريات -->
    <div id="add-sub-container">
        <div class="box" style="border:1px dashed var(--gold); margin-top:20px;" onclick="addCategory()"><i>➕</i> <b>إضافة قسم فرعي</b></div>
    </div>
</div>

<!-- قائمة الأفلام/المسلسلات -->
<div id="screen-items" class="screen">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h2 id="items-title">المحتوى</h2>
        <button onclick="openForm()" style="background:#00d2d3; color:#000; padding:8px 15px; border-radius:8px; border:none; font-weight:bold;">➕ إضافة</button>
    </div>
    <div id="items-list"></div>
</div>

<!-- الفورم -->
<div id="screen-form" class="screen">
    <h2 id="form-title">إضافة جديد</h2>
    <input type="hidden" id="editId">
    <input type="text" id="name" placeholder="الاسم">
    <input type="text" id="img" placeholder="رابط البوستر">
    <input type="text" id="link" placeholder="رابط المشاهدة">
    <button class="save-btn" onclick="saveData()">حفظ التعديلات ✅</button>
</div>

<script>
    let db = { items: [], categories: [] };
    let config = { token: '', repo: '' };
    let currentMain = ''; 
    let currentSub = '';

    async function login() {
        config.token = document.getElementById('token').value;
        config.repo = document.getElementById('repo').value;
        if(!config.token || !config.repo) return alert("اكمل البيانات");

        showLoader(true);
        try {
            const res = await fetch(`https://api.github.com/repos/${config.repo}/contents/data.json`, {
                headers: { 'Authorization': `token ${config.token}` }
            });
            const file = await res.json();
            const content = JSON.parse(decodeURIComponent(escape(atob(file.content))));
            
            // التأكد من وجود مصفوفات الأقلام والأقسام
            db.items = Array.isArray(content) ? content : (content.items || []);
            db.categories = content.categories || [
                {id:'egy1', name:'أفلام مصرية 1', parent:'movies'},
                {id:'egy2', name:'أفلام مصرية 2', parent:'movies'},
                {id:'ramadan', name:'مسلسلات رمضان', parent:'series'},
                {id:'arabic', name:'مسلسلات مصرية', parent:'series'},
                {id:'match', name:'ملخصات المباريات', parent:'matches'}
            ];
            
            document.getElementById('screen-login').classList.remove('active-screen');
            document.getElementById('nav').style.display = 'flex';
            showScreen('screen-home');
        } catch (e) { alert("خطأ في البيانات أو التوكن!"); }
        showLoader(false);
    }

    function openMainCat(type) {
        currentMain = type;
        const subsDiv = document.getElementById('subs-list');
        const title = document.getElementById('sub-title');
        const addBtnContainer = document.getElementById('add-sub-container');
        subsDiv.innerHTML = '';

        // إخفاء زر الإضافة لو كان القسم هو المباريات
        addBtnContainer.style.display = (type === 'matches') ? 'none' : 'block';

        if(type === 'movies') title.innerText = "أقسام الأفلام";
        else if(type === 'series') title.innerText = "أقسام المسلسلات";
        else title.innerText = "المباريات";

        const filteredCats = db.categories.filter(c => c.parent === type);
        filteredCats.forEach(c => {
            subsDiv.innerHTML += `<div class="box" onclick="openItems('${c.id}', '${c.name}')"><i>📂</i> <b>${c.name}</b></div>`;
        });
        showScreen('screen-subs');
    }

    function addCategory() {
        const name = prompt("أدخل اسم القسم الفرعي الجديد:");
        if (name) {
            const newId = 'cat_' + Date.now();
            db.categories.push({ id: newId, name: name, parent: currentMain });
            sync(); // حفظ في GitHub
            openMainCat(currentMain); // إعادة عرض القائمة
        }
    }

    function openItems(id, name) {
        currentSub = id;
        document.getElementById('items-title').innerText = name;
        renderItems();
        showScreen('screen-items');
    }

    function renderItems() {
        const list = document.getElementById('items-list');
        list.innerHTML = '';
        const filtered = db.items.filter(i => i.cat === currentSub);
        
        filtered.forEach(item => {
            list.innerHTML += `
                <div class="item">
                    <img src="${item.img}">
                    <div class="item-info">
                        <b>${item.name}</b>
                        <div class="actions">
                            <span onclick="editItem(${item.id})" style="color:#2e86de; cursor:pointer">تعديل</span>
                            <span onclick="deleteItem(${item.id})" style="color:var(--danger); cursor:pointer">حذف</span>
                        </div>
                    </div>
                </div>`;
        });
    }

    function openForm() {
        document.getElementById('editId').value = '';
        document.getElementById('name').value = '';
        document.getElementById('img').value = '';
        document.getElementById('link').value = '';
        showScreen('screen-form');
    }

    function editItem(id) {
        const item = db.items.find(i => i.id === id);
        document.getElementById('editId').value = item.id;
        document.getElementById('name').value = item.name;
        document.getElementById('img').value = item.img;
        document.getElementById('link').value = item.link;
        showScreen('screen-form');
    }

    async function deleteItem(id) {
        if(confirm("حذف؟")) {
            db.items = db.items.filter(i => i.id !== id);
            await sync();
            renderItems();
        }
    }

    async function saveData() {
        const id = document.getElementById('editId').value;
        const obj = {
            id: id ? parseInt(id) : Date.now(),
            name: document.getElementById('name').value,
            img: document.getElementById('img').value,
            link: document.getElementById('link').value,
            cat: currentSub
        };

        if(id) {
            const idx = db.items.findIndex(i => i.id == id);
            db.items[idx] = obj;
        } else {
            db.items.push(obj);
        }
        await sync();
        showScreen('screen-items');
        renderItems();
    }

    async function sync() {
        showLoader(true);
        try {
            const res = await fetch(`https://api.github.com/repos/${config.repo}/contents/data.json`, {
                headers: { 'Authorization': `token ${config.token}` }
            });
            const file = await res.json();
            const content = btoa(unescape(encodeURIComponent(JSON.stringify(db, null, 2))));
            await fetch(`https://api.github.com/repos/${config.repo}/contents/data.json`, {
                method: 'PUT',
                headers: { 'Authorization': `token ${config.token}` },
                body: JSON.stringify({ message: "Update Romeo DB", content, sha: file.sha })
            });
        } catch (e) { alert("خطأ في الحفظ"); }
        showLoader(false);
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
        document.getElementById(id).classList.add('active-screen');
        document.getElementById('backBtn').style.display = (id === 'screen-home') ? 'none' : 'block';
    }

    function goBack() {
        const active = document.querySelector('.active-screen').id;
        if(active === 'screen-subs') showScreen('screen-home');
        if(active === 'screen-items') showScreen('screen-subs');
        if(active === 'screen-form') showScreen('screen-items');
    }

    function showLoader(v) { document.getElementById('loader').style.display = v ? 'flex' : 'none'; }
</script>
<style>@keyframes spin { to { transform: rotate(360deg); } }</style>
</body>
</html>
