<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROMEO TV Pro | لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #e5b80b; --bg: #050811; --card: #111827; --danger: #ff4757; --music: #10ac84; --input-bg: #1e293b; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: var(--bg); color: #fff; line-height: 1.6; }

        .screen { display: none; padding: 20px; animation: fadeIn 0.3s; }
        .active-screen { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        header { background: var(--card); padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold); position: sticky; top: 0; z-index: 100; }
        .back-btn { background: #1e293b; padding: 5px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; }

        .grid { display: grid; grid-template-columns: 1fr; gap: 15px; margin-top: 15px; }
        .box { background: var(--card); padding: 25px; border-radius: 18px; display: flex; align-items: center; gap: 15px; border: 1px solid #1e293b; cursor: pointer; transition: 0.3s; }
        .box:active { transform: scale(0.95); }
        .box i { font-size: 30px; }
        .box b { font-size: 18px; }

        .item { background: var(--card); padding: 10px; border-radius: 12px; display: flex; gap: 15px; margin-bottom: 10px; border: 1px solid #1e293b; align-items: center; }
        .item img { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; }
        .item-info { flex: 1; }
        .actions { display: flex; gap: 12px; margin-top: 5px; }
        
        .form-container { text-align: center; max-width: 500px; margin: 0 auto; }
        input, select { width: 100%; padding: 18px; margin-bottom: 20px; background: var(--input-bg); border: 1px solid #374151; border-radius: 12px; color: #fff; font-size: 16px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--gold); }
        .save-btn { background: var(--gold); color: #000; width: 100%; padding: 15px; border-radius: 10px; border: none; font-weight: 900; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }

        #loader { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loader">
    <div style="border:3px solid #f3f3f3; border-top:3px solid var(--gold); width:40px; height:40px; border-radius:50%; animation:spin 1s linear infinite;"></div>
    <p style="margin-top:15px">جاري المزامنة مع GitHub...</p>
</div>

<div id="screen-login" class="screen active-screen">
    <div style="text-align:center; margin-top:80px;">
        <h1 style="color:var(--gold); font-weight:900; font-size: 35px;">ROMEO TV</h1>
        <p style="margin-bottom:30px; opacity:0.7;">لوحة التحكم الشاملة (أفلام - مسلسلات - أغاني)</p>
        <input type="password" id="token" placeholder="GitHub Token">
        <input type="text" id="repo" placeholder="المستودع (user/repo)">
        <button class="save-btn" onclick="login()">دخول للمنصة 🔓</button>
    </div>
</div>

<header id="nav" style="display:none">
    <div class="back-btn" id="backBtn" onclick="goBack()">⬅ رجوع</div>
    <div style="font-weight:900; color: var(--gold);">ROMEO ADMIN</div>
</header>

<div id="screen-home" class="screen">
    <h2 style="margin-bottom: 10px;">لوحة التحكم الرئيسية 🎬</h2>
    <div class="grid">
        <div class="box" onclick="openMainCat('movies')"><i>🎬</i> <b>الأفلام</b></div>
        <div class="box" onclick="openMainCat('series')"><i>📺</i> <b>المسلسلات</b></div>
        <div class="box" onclick="openItems('music', 'مكتبة الأغاني')"><i>🎵</i> <b style="color:var(--music)">الأغاني والمهرجانات</b></div>
        <div class="box" onclick="openMainCat('matches')"><i>⚽</i> <b>المباريات</b></div>
    </div>
</div>

<div id="screen-subs" class="screen">
    <h2 id="sub-title" style="color:var(--gold)"></h2>
    <div class="grid" id="subs-list"></div>
    <div id="add-sub-container">
        <div class="box" style="border:1px dashed var(--gold); margin-top:20px;" onclick="addCategory()"><i>➕</i> <b>إضافة قسم فرعي</b></div>
    </div>
</div>

<div id="screen-items" class="screen">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h2 id="items-title">المحتوى</h2>
        <button onclick="openForm('item')" style="background:var(--music); color:#fff; padding:8px 15px; border-radius:8px; border:none; font-weight:bold;">➕ إضافة جديد</button>
    </div>
    <div id="items-list"></div>
</div>

<div id="screen-episodes" class="screen">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h2 id="series-name-display">حلقات المسلسل</h2>
        <button onclick="openForm('episode')" style="background:#2e86de; color:#fff; padding:8px 15px; border-radius:8px; border:none; font-weight:bold;">➕ إضافة حلقة</button>
    </div>
    <div id="episodes-list"></div>
</div>

<div id="screen-form" class="screen">
    <div class="form-container">
        <h2 id="form-title" style="font-size: 28px; margin-bottom: 5px;">إضافة عنصر جديد</h2>
        <p style="font-size: 14px; margin-bottom: 30px; color: var(--gold);">* تأكد من صحة البيانات لضمان التشغيل</p>
        <input type="hidden" id="editType"> <!-- نوع الحفظ: حلقة أم مسلسل -->
        <input type="hidden" id="editId">
        <input type="text" id="name" placeholder="الاسم (مسلسل أو حلقة)">
        <input type="text" id="img" placeholder="رابط البوستر (صورة)">
        <input type="text" id="link" placeholder="رابط المشاهدة (Embed)">
        <button class="save-btn" onclick="saveData()">حفظ البيانات ✅</button>
    </div>
</div>

<script>
    let db = { items: [], categories: [] };
    let config = { token: '', repo: '' };
    let currentMain = ''; 
    let currentSub = '';
    let currentSeriesId = null;

    async function login() {
        config.token = document.getElementById('token').value;
        config.repo = document.getElementById('repo').value;
        if(!config.token || !config.repo) return alert("برجاء إدخال البيانات");
        showLoader(true);
        try {
            const res = await fetch(`https://api.github.com/repos/${config.repo}/contents/data.json`, {
                headers: { 'Authorization': `token ${config.token}` }
            });
            const file = await res.json();
            const content = JSON.parse(decodeURIComponent(escape(atob(file.content))));
            db.items = Array.isArray(content) ? content : (content.items || []);
            db.categories = content.categories || [
                {id:'ramadan', name:'مسلسلات رمضان', parent:'series'},
                {id:'egy1', name:'أفلام مصرية 1', parent:'movies'}
            ];
            document.getElementById('screen-login').classList.remove('active-screen');
            document.getElementById('nav').style.display = 'flex';
            showScreen('screen-home');
        } catch (e) { alert("فشل الاتصال!"); }
        showLoader(false);
    }

    function openMainCat(type) {
        currentMain = type;
        const subsDiv = document.getElementById('subs-list');
        subsDiv.innerHTML = '';
        document.getElementById('sub-title').innerText = (type === 'series' ? "أقسام المسلسلات 📺" : "الأقسام");
        db.categories.filter(c => c.parent === type).forEach(c => {
            subsDiv.innerHTML += `<div class="box" onclick="openItems('${c.id}', '${c.name}')"><i>📂</i> <b>${c.name}</b></div>`;
        });
        showScreen('screen-subs');
    }

    function openItems(id, name) {
        currentSub = id;
        document.getElementById('items-title').innerText = name;
        renderItems();
        showScreen('screen-items');
    }

    function renderItems() {
        const list = document.getElementById('items-list');
        list.innerHTML = '';
        db.items.filter(i => i.cat === currentSub).forEach(item => {
            let seriesBtn = currentMain === 'series' ? `<span onclick="enterSeries(${item.id})" style="color:var(--gold); cursor:pointer; font-size:14px; margin-right:15px;">👁️ دخول</span>` : '';
            list.innerHTML += `
                <div class="item">
                    <img src="${item.img}">
                    <div class="item-info">
                        <b>${item.name}</b>
                        <div class="actions">
                            ${seriesBtn}
                            <span onclick="editItem(${item.id})" style="color:#2e86de; cursor:pointer; font-size:14px;">📝 تعديل</span>
                            <span onclick="deleteItem(${item.id})" style="color:var(--danger); cursor:pointer; font-size:14px; margin-right:15px;">🗑️ حذف</span>
                        </div>
                    </div>
                </div>`;
        });
    }

    function enterSeries(id) {
        currentSeriesId = id;
        const series = db.items.find(i => i.id === id);
        document.getElementById('series-name-display').innerText = series.name;
        renderEpisodes();
        showScreen('screen-episodes');
    }

    function renderEpisodes() {
        const list = document.getElementById('episodes-list');
        list.innerHTML = '';
        const series = db.items.find(i => i.id === currentSeriesId);
        if(!series.episodes) series.episodes = [];
        series.episodes.forEach((ep, index) => {
            list.innerHTML += `
                <div class="item">
                    <div class="item-info"><b>${ep.name}</b></div>
                    <div class="actions">
                        <span onclick="editEpisode(${index})" style="color:#2e86de; cursor:pointer; font-size:14px;">📝 تعديل</span>
                        <span onclick="deleteEp(${index})" style="color:var(--danger); cursor:pointer; font-size:14px; margin-right:15px;">🗑️ حذف</span>
                    </div>
                </div>`;
        });
    }

    function openForm(type, index = null) {
        document.getElementById('editType').value = type;
        document.getElementById('editId').value = index !== null ? index : '';
        document.getElementById('name').value = '';
        document.getElementById('img').value = '';
        document.getElementById('link').value = '';
        document.getElementById('form-title').innerText = type === 'episode' ? "إضافة حلقة جديدة" : "إضافة عنصر جديد";
        
        document.getElementById('img').style.display = type === 'episode' ? 'none' : 'block';
        
        showScreen('screen-form');
    }

    function editItem(id) {
        const item = db.items.find(i => i.id === id);
        openForm('item');
        document.getElementById('editId').value = item.id;
        document.getElementById('name').value = item.name;
        document.getElementById('img').value = item.img;
        document.getElementById('link').value = item.link || '';
        document.getElementById('form-title').innerText = "تعديل البيانات";
    }

    function editEpisode(index) {
        const series = db.items.find(i => i.id === currentSeriesId);
        const ep = series.episodes[index];
        openForm('episode', index);
        document.getElementById('name').value = ep.name;
        document.getElementById('link').value = ep.link;
        document.getElementById('form-title').innerText = "تعديل الحلقة";
    }

    async function deleteEp(index) {
        if(confirm("حذف هذه الحلقة؟")) {
            const series = db.items.find(i => i.id === currentSeriesId);
            series.episodes.splice(index, 1);
            series.episodes.forEach((ep, idx) => ep.num = (idx + 1).toString());
            await sync();
            renderEpisodes();
        }
    }

    async function saveData() {
        const type = document.getElementById('editType').value;
        const indexOrId = document.getElementById('editId').value;
        const name = document.getElementById('name').value;
        const img = document.getElementById('img').value;
        const link = document.getElementById('link').value;

        if(type === 'item') {
            const obj = {
                id: indexOrId ? parseInt(indexOrId) : Date.now(),
                name, 
                img, 
                link, 
                cat: currentSub,
                type: currentMain === 'series' ? 'series' : 'movie',
                episodes: indexOrId ? (db.items.find(i => i.id == indexOrId).episodes || []) : []
            };
            if(indexOrId) {
                const idx = db.items.findIndex(i => i.id == indexOrId);
                db.items[idx] = obj;
            } else {
                db.items.push(obj);
            }
            showScreen('screen-items');
            renderItems();
        } else {
            const series = db.items.find(i => i.id === currentSeriesId);
            if(!series.episodes) series.episodes = [];
            
            const epNum = indexOrId !== '' ? series.episodes[indexOrId].num : (series.episodes.length + 1).toString();
            const epObj = { 
                num: epNum, 
                name: name, 
                link: link 
            };

            if(indexOrId !== '') series.episodes[indexOrId] = epObj;
            else series.episodes.push(epObj);
            
            showScreen('screen-episodes');
            renderEpisodes();
        }
        await sync();
    }

    async function sync() {
        showLoader(true);
        try {
            const res = await fetch(`https://api.github.com/repos/${config.repo}/contents/data.json`, {
                headers: { 'Authorization': `token ${config.token}` }
            });
            const file = await res.json();
            const content = btoa(unescape(encodeURIComponent(JSON.stringify(db, null, 2))));
            await fetch(`https://api.github.com/repos/${config.repo}/contents/data.json`, {
                method: 'PUT',
                headers: { 'Authorization': `token ${config.token}` },
                body: JSON.stringify({ message: "Update Data", content, sha: file.sha })
            });
        } catch (e) { alert("خطأ مزامنة!"); }
        showLoader(false);
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
        document.getElementById(id).classList.add('active-screen');
        document.getElementById('backBtn').style.display = (id === 'screen-home') ? 'none' : 'block';
    }

    function goBack() {
        const active = document.querySelector('.active-screen').id;
        if(active === 'screen-subs') showScreen('screen-home');
        else if(active === 'screen-items') showScreen('screen-subs');
        else if(active === 'screen-episodes') showScreen('screen-items');
        else if(active === 'screen-form') {
            const type = document.getElementById('editType').value;
            showScreen(type === 'episode' ? 'screen-episodes' : 'screen-items');
        }
    }

    function showLoader(v) { document.getElementById('loader').style.display = v ? 'flex' : 'none'; }
    async function deleteItem(id) {
        if(confirm("حذف نهائي؟")) {
            db.items = db.items.filter(i => i.id !== id);
            await sync();
            renderItems();
        }
    }
</script>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        const formContainer = document.querySelector('#screen-form .form-container');
        const saveBtn = formContainer.querySelector('.save-btn');
        
        const input2 = document.createElement('input');
        input2.type = 'text';
        input2.id = 'link2';
        input2.placeholder = 'رابط سيرفر 2 (إختياري)';
        
        const input3 = document.createElement('input');
        input3.type = 'text';
        input3.id = 'link3';
        input3.placeholder = 'رابط سيرفر 3 (إختياري)';
        
        formContainer.insertBefore(input2, saveBtn);
        formContainer.insertBefore(input3, saveBtn);

        saveBtn.setAttribute('onclick', 'saveDataNew()');
    });

    async function saveDataNew() {
        const type = document.getElementById('editType').value;
        const indexOrId = document.getElementById('editId').value;
        const name = document.getElementById('name').value;
        const img = document.getElementById('img').value;
        const link = document.getElementById('link').value;
        const link2 = document.getElementById('link2').value;
        const link3 = document.getElementById('link3').value;

        if(type === 'item') {
            const existingItem = indexOrId ? db.items.find(i => i.id == indexOrId) : null;
            const obj = {
                id: indexOrId ? parseInt(indexOrId) : Date.now(),
                name, 
                img, 
                link,
                link2: link2 || "",
                link3: link3 || "",
                cat: currentSub,
                type: currentMain === 'series' ? 'series' : 'movie',
                episodes: existingItem ? (existingItem.episodes || []) : []
            };
            if(indexOrId) {
                const idx = db.items.findIndex(i => i.id == indexOrId);
                db.items[idx] = obj;
            } else {
                db.items.push(obj);
            }
            showScreen('screen-items');
            renderItems();
        } else {
            const series = db.items.find(i => i.id === currentSeriesId);
            if(!series.episodes) series.episodes = [];
            
            const epNum = indexOrId !== '' ? series.episodes[indexOrId].num : (series.episodes.length + 1).toString();
            const epObj = { 
                num: epNum, 
                name: name, 
                link: link,
                link2: link2 || "",
                link3: link3 || ""
            };

            if(indexOrId !== '') series.episodes[indexOrId] = epObj;
            else series.episodes.push(epObj);
            
            showScreen('screen-episodes');
            renderEpisodes();
        }
        await sync();
    }

    function goBackFixed() {
        const active = document.querySelector('.active-screen').id;
        if(active === 'screen-subs') showScreen('screen-home');
        else if(active === 'screen-items') showScreen('screen-subs');
        else if(active === 'screen-episodes') showScreen('screen-items');
        else if(active === 'screen-form') {
            const type = document.getElementById('editType').value;
            showScreen(type === 'episode' ? 'screen-episodes' : 'screen-items');
        }
    }
    document.getElementById('backBtn').onclick = goBackFixed;

    const oldEditItem = editItem;
    editItem = function(id) {
        oldEditItem(id);
        const item = db.items.find(i => i.id === id);
        document.getElementById('link2').value = item.link2 || '';
        document.getElementById('link3').value = item.link3 || '';
    };

    const oldEditEpisode = editEpisode;
    editEpisode = function(index) {
        oldEditEpisode(index);
        const series = db.items.find(i => i.id === currentSeriesId);
        const ep = series.episodes[index];
        document.getElementById('link2').value = ep.link2 || '';
        document.getElementById('link3').value = ep.link3 || '';
    };

    const oldOpenForm = openForm;
    openForm = function(type, index = null) {
        oldOpenForm(type, index);
        document.getElementById('link2').value = '';
        document.getElementById('link3').value = '';
    }
</script>

<!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->
<!-- 🆕 الإضافة الجديدة: رابط التحميل فقط 🆕 -->
<!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->

<script>
    (function addDownloadFeature() {
        // 1. إضافة خانة إدخال رابط التحميل في شاشة الفورم
        const container = document.querySelector('#screen-form .form-container');
        const saveBtn = container.querySelector('.save-btn');
        
        const dlInput = document.createElement('input');
        dlInput.id = 'download_url';
        dlInput.placeholder = 'رابط التحميل المباشر (إختياري)';
        
        // وضع الخانة قبل زر الحفظ مباشرة
        container.insertBefore(dlInput, saveBtn);

        // 2. تحديث وظيفة الحفظ النهائية لدعم حقل التحميل
        // نقوم بتبديل وظيفة saveDataNew بوظيفة تدعم الحقل الإضافي
        window.saveDataFinal = async function() {
            const type = document.getElementById('editType').value;
            const indexOrId = document.getElementById('editId').value;
            const name = document.getElementById('name').value;
            const img = document.getElementById('img').value;
            const link = document.getElementById('link').value;
            const link2 = document.getElementById('link2').value;
            const link3 = document.getElementById('link3').value;
            const downloadUrl = document.getElementById('download_url').value;

            if(type === 'item') {
                const existingItem = indexOrId ? db.items.find(i => i.id == indexOrId) : null;
                const obj = {
                    id: indexOrId ? parseInt(indexOrId) : Date.now(),
                    name, img, link,
                    link2: link2 || "",
                    link3: link3 || "",
                    download_url: downloadUrl || "",
                    cat: currentSub,
                    type: currentMain === 'series' ? 'series' : 'movie',
                    episodes: existingItem ? (existingItem.episodes || []) : []
                };
                if(indexOrId) {
                    const idx = db.items.findIndex(i => i.id == indexOrId);
                    db.items[idx] = obj;
                } else {
                    db.items.push(obj);
                }
                showScreen('screen-items');
                renderItems();
            } else {
                const series = db.items.find(i => i.id === currentSeriesId);
                if(!series.episodes) series.episodes = [];
                const epNum = indexOrId !== '' ? series.episodes[indexOrId].num : (series.episodes.length + 1).toString();
                const epObj = { 
                    num: epNum, name: name, link: link,
                    link2: link2 || "",
                    link3: link3 || "",
                    download_url: downloadUrl || ""
                };
                if(indexOrId !== '') series.episodes[indexOrId] = epObj;
                else series.episodes.push(epObj);
                showScreen('screen-episodes');
                renderEpisodes();
            }
            await sync();
        };

        saveBtn.setAttribute('onclick', 'saveDataFinal()');

        // 3. ربط حقل التحميل بعمليات التعديل (فتح البيانات القديمة)
        const currentEditItem = editItem;
        editItem = function(id) {
            currentEditItem(id);
            const item = db.items.find(i => i.id === id);
            document.getElementById('download_url').value = item.download_url || '';
        };

        const currentEditEp = editEpisode;
        editEpisode = function(index) {
            currentEditEp(index);
            const series = db.items.find(i => i.id === currentSeriesId);
            const ep = series.episodes[index];
            document.getElementById('download_url').value = ep.download_url || '';
        };

        const currentOpenForm = openForm;
        openForm = function(type, index = null) {
            currentOpenForm(type, index);
            document.getElementById('download_url').value = '';
        };
    })();
</script>

</body>
</html>
